# ─── orderandgo dev ───
server {
    listen 80;
    listen 443 ssl;
    server_name dev-order.ghmate.com;
    ssl_certificate /etc/nginx/certs/cloudflare_chain.crt;
    ssl_certificate_key /etc/nginx/certs/cloudflare.key;

    # Docker 내장 DNS. 변수 proxy_pass 와 함께 써야 요청마다 런타임 재확인이 동작한다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $up_dev orderandgo_service_dev;   # 컨테이너명을 변수로 → nginx 가 요청마다 재확인
        proxy_pass http://$up_dev:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}

# ─── orderandgo prod ───
server {
    listen 80;
    listen 443 ssl;
    server_name order.ghmate.com;
    ssl_certificate /etc/nginx/certs/cloudflare_chain.crt;
    ssl_certificate_key /etc/nginx/certs/cloudflare.key;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $up_prod orderandgo_service_prod;   # 컨테이너명을 변수로 → nginx 가 요청마다 재확인
        proxy_pass http://$up_prod:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}
