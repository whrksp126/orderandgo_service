{% extends "auth_layout.html" %}
{% block title %}내 매장 — 오더앤고{% endblock %}

{% block auth %}
<h1 class="au-title">내 매장</h1>
{% if store_list %}
<p class="au-sub">들어갈 매장을 선택해주세요.</p>
{% else %}
<p class="au-sub">아직 매장이 없어요. 첫 매장을 만들어 보세요.</p>
{% endif %}

<ul class="au-stores" id="storeList">
  {% for store in store_list %}
  <li>
    <button type="button" class="au-store" data-store-id="{{ store.store_id }}">
      <span class="au-store-info">
        <strong>{{ store.name }}</strong>
        <small>{{ store.store_id }}</small>
      </span>
      {% if store.current %}<em class="au-chip">사용 중</em>{% endif %}
      <i class="ph ph-caret-right au-store-go"></i>
    </button>
  </li>
  {% endfor %}
  <li><a class="au-store au-store--new" href="/stores/new">+ 새 매장 만들기</a></li>
</ul>
<div class="au-msg" id="msg_stores" role="alert"></div>

<div class="au-links"><button type="button" class="au-link js-logout">로그아웃</button></div>
{% endblock %}
