<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>비밀번호 재설정 | 오더앤고</title>
  <link rel="icon" type="image/x-icon" href="/static/images/common/logo.png">
  <link rel="stylesheet" href="/static/css/responsive.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/reset.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/common.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/animation.css?v={{ static_v }}">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="/static/css/login.css?v={{ static_v }}">
</head>
<body class="register">
  <div id="app">
    <main>
      <h1><a href="/"><img src="/static/images/common/logo-order&go-color.png" alt=""></a></h1>
      <h1>비밀번호 재설정</h1>
      <form onsubmit="onSubmitFindPassword(event)">
        <label for="" class="js-verify">핸드폰번호</label>
        <div class="tel_box js-verify">
          <input type='tel' data-index="0" name='phone1' maxlength="3" oninput="changeInputTel(event)" placeholder="010" required/>
          <span>-</span>
          <input type='tel' data-index="1" name='phone2' maxlength="4" oninput="changeInputTel(event)" placeholder="0000" required/>
          <span>-</span>
          <input type='tel' data-index="2" name='phone3' maxlength="4" oninput="changeInputTel(event)" placeholder="0000" required/>
        </div>

        <label for="" class="js-verify">문자인증</label>
        <div class="code_row js-verify">
          <input id="code_number" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="인증번호를 입력해주세요">
          <button type="button" class="border_btn" onclick="clickRequestVerifyCode(event)">인증번호 받기</button>
        </div>
        <button type="button" id="verify_btn" class="border_btn" onclick="clickVerifyCode(event)" style="display:none;width:100%;margin-top:8px;">인증 확인</button>
        <div id="verified_badge" class="verified_badge" style="display:none;"><i class="ph ph-check-circle"></i><span id="verified_text">전화번호 인증 완료</span></div>

        <label for="" class="js-secret" style="display:none;">새 비밀번호</label>
        <div class="password_box js-secret" style="display:none;">
          <input type="password" placeholder="새 비밀번호를 입력해주세요" id="new_password" name="new_password">
          <button type="button" class="not_btn_box" onclick="clickToggleShowPassword(event)">
            <i class="ph ph-eye"></i>
            <i class="ph ph-eye-slash"></i>
          </button>
        </div>
        <label for="" class="js-secret" style="display:none;">새 비밀번호 확인</label>
        <div class="password_box js-secret" style="display:none;">
          <input type="password" placeholder="새 비밀번호를 한 번 더 입력해주세요" id="password_confirm" autocomplete="new-password">
          <button type="button" class="not_btn_box" onclick="clickToggleShowPassword(event)">
            <i class="ph ph-eye"></i>
            <i class="ph ph-eye-slash"></i>
          </button>
        </div>
        <div class="form_msg" id="form_msg"></div>
        <input type="submit" value="비밀번호 변경" class="js-secret" style="display:none;">
        <div id="recaptcha-container"></div>
        <div class="buttons another">
          <a href="/login">로그인으로 돌아가기</a>
        </div>
      </form>
    </main>
    <aside></aside>
  </div>
  <div class="toast_wrap" id="toast_wrap"></div>
  <script>window.FIREBASE_CONFIG = {{ firebase | tojson }}; window.OG_PHONE_MODE = 'reset';</script>
  <script type="module" src="/static/js/firebase-phone.js?v={{ static_v }}"></script>
  <script src="/static/js/login.js?v={{ static_v }}"></script>
  <script>
    function onSubmitFindPassword(event) {
      event.preventDefault();
      const tel = [...document.querySelectorAll('input[type="tel"]')].map(el => el.value).join('');
      const new_password = document.getElementById('new_password').value;
      const formMsg = document.getElementById('form_msg');
      if (window.ogFirebasePhone && !window.__ogVerifiedToken) {
        formMsg.style.color = 'red'; formMsg.textContent = '전화번호 인증을 먼저 완료해주세요.'; return;
      }
      if (!new_password || new_password.length < 4) {
        formMsg.style.color = 'red'; formMsg.textContent = '새 비밀번호를 입력해주세요.'; return;
      }
      if (new_password !== document.getElementById('password_confirm').value) {
        formMsg.style.color = 'red'; formMsg.textContent = '비밀번호가 서로 일치하지 않습니다.'; return;
      }
      const submitBtn = event.target.querySelector('input[type="submit"]');
      setBtnLoading(submitBtn, true);
      const fd = new FormData();
      fd.append('tel', tel);
      fd.append('new_password', new_password);
      if (window.__ogVerifiedToken) fd.append('firebase_id_token', window.__ogVerifiedToken);
      fetch('/find_password', { method: 'POST', body: fd })
        .then(r => r.json())
        .then(data => {
          formMsg.textContent = data.message;
          if (data.code === 200) {
            formMsg.style.color = 'green';
            setTimeout(() => { window.location.href = '/login'; }, 1500);
          } else {
            setBtnLoading(submitBtn, false);
            formMsg.style.color = 'red';
          }
        })
        .catch(() => { setBtnLoading(submitBtn, false); formMsg.style.color = 'red'; formMsg.textContent = '오류가 발생했습니다.'; });
    }
  </script>
</body>
</html>
