<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>orderandgo</title>
  <link rel="icon" type="image/x-icon" href="/static/images/common/logo.png">

  <link rel="stylesheet" href="/static/css/responsive.css">
  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/animation.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="/static/css/login.css">
</head>
<body class="register">
  <div id="app">
    <main>
      <h1><a href="/"><img src="/static/images/common/logo-order&go-color.png" alt=""></a></h1>
      <h1>비밀번호 찾기</h1>
      <form onsubmit="onSubmitFindPassword(event)">
        <label for="">핸드폰번호</label>
        <div class="tel_box">
          <input type='tel' data-index="0" name='phone1' maxlength="3" oninput="changeInputTel(event)" placeholder="010" required/>
          <span>-</span>
          <input type='tel' data-index="1" name='phone2' maxlength="4" oninput="changeInputTel(event)" placeholder="0000" required/>
          <span>-</span>
          <input type='tel' data-index="2" name='phone3' maxlength="4" oninput="changeInputTel(event)" placeholder="0000" required/>
        </div>
        <label for="">새 비밀번호</label>
        <div class="password_box">
          <input type="password" placeholder="새 비밀번호를 입력해주세요" id="new_password" name="new_password" required>
          <button class="not_btn_box" onclick="clickToggleShowPassword(event)">
            <i class="ph ph-eye"></i>
            <i class="ph ph-eye-slash"></i>
          </button>
        </div>
        <div class="form_msg" id="form_msg"></div>
        <input type="submit" value="비밀번호 변경">
        <div class="buttons another">
          <a href="/login">로그인으로 돌아가기</a>
        </div>
      </form>
    </main>
    <aside></aside>
  </div>
  <script src="/static/js/login.js"></script>
  <script>
    function onSubmitFindPassword(event) {
      event.preventDefault();
      const phone1 = document.querySelector('input[name="phone1"]').value;
      const phone2 = document.querySelector('input[name="phone2"]').value;
      const phone3 = document.querySelector('input[name="phone3"]').value;
      const tel = phone1 + phone2 + phone3;
      const new_password = document.getElementById('new_password').value;
      const formMsg = document.getElementById('form_msg');

      const formData = new FormData();
      formData.append('tel', tel);
      formData.append('new_password', new_password);

      fetch('/find_password', {
        method: 'POST',
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        formMsg.textContent = data.message;
        if (data.code === 200) {
          formMsg.style.color = 'green';
          setTimeout(() => { window.location.href = '/login'; }, 1500);
        } else {
          formMsg.style.color = 'red';
        }
      });
    }
  </script>
</body>
</html>
