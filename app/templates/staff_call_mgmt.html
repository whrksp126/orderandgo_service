<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OrderAndGo · 직원 호출 관리</title>
  <link rel="icon" type="image/x-icon" href="/static/images/common/logo.png">

  <link rel="stylesheet" href="/static/css/responsive.css">
  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/common.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/animation.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="/static/css/store.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/store_settings.css?v={{ static_v }}">
</head>

<body class="setting_page staff-call-mgmt">
  <div id="container">
    <header>
      <a class="back_btn" href="/store/product">
        <i class="ph-bold ph-caret-left"></i>
      </a>
      <div class="center">
        <a onclick="location.reload();">
          <h1><img src="/static/images/common/logo-order&go-white.png" alt=""></h1>
        </a>
        <div class="header_info">
          <span class="cur_time"></span>
          <span class="store_state" data-state="open">영업중</span>
        </div>
      </div>
    </header>

    <main>
      <article class="setting_panel">
        <div class="setting_panel_top">
          <h2>직원 호출 항목</h2>
          <div class="grid-settings">
            <span>배치</span>
            <input type="number" class="setting_input" id="gridRowsInput" min="1" max="10" value="4">
            <i>×</i>
            <input type="number" class="setting_input" id="gridColsInput" min="1" max="10" value="4">
            <button class="setting_btn brand" onclick="applyGridChange()">적용</button>
          </div>
        </div>

        <div class="staff-call-grid scrollbar_hidden" id="itemGrid">
          <!-- JS 렌더링 -->
          <div class="setting_empty" style="grid-column: 1 / -1;">불러오는 중</div>
        </div>
      </article>

      <aside class="setting_panel">
        <div class="setting_panel_top">
          <h2 id="paneTitle">항목 추가</h2>
          <div id="posBadge" class="pos-badge" style="display: none;">#0</div>
        </div>

        <div class="setting_panel_body scrollbar_hidden">
          <div class="image-upload-box" onclick="document.getElementById('imageInput').click()">
            <img id="imagePreview" src="" style="display: none;">
            <div id="uploadPlaceholder">이미지 선택</div>
            <input type="file" id="imageInput" accept="image/*" style="display: none;"
              onchange="handleImageSelect(this)">
          </div>

          <div class="info_row">
            <label class="setting_label" for="itemName">항목명</label>
            <input type="text" class="setting_input" id="itemName" placeholder="예: 물, 티슈, 앞치마">
          </div>

          <div class="setting_toggle_row">
            <span>수량 선택</span>
            <button id="useQuantityBtn" class="toggle_btn" data-active="false" onclick="toggleUseQuantity()">
              <div class="ball"></div>
            </button>
          </div>

          <input type="hidden" id="selectedId" value="">
          <input type="hidden" id="itemPosition" value="">
        </div>

        <div class="setting_panel_bottom">
          <button type="button" class="setting_btn red" id="deleteBtn" onclick="deleteItem(event)"
            style="display: none;">삭제</button>
          <button type="button" class="setting_btn gray" onclick="resetForm()">취소</button>
          <button type="button" class="setting_btn fill" onclick="saveItem()">저장</button>
        </div>
      </aside>
    </main>
  </div>

  <script src="/static/js/common.js?v={{ static_v }}"></script>
  <script src="/static/js/device-notice.js?v={{ static_v }}"></script>
  <script>
    let currentItems = [];
    let selectedItemId = null;
    let selectedPosition = null;
    let gridRows = 4;
    let gridCols = 4;
    let selectedImageFile = null;

    document.addEventListener('DOMContentLoaded', () => {
      loadItems();
    });

    async function loadItems(updateGridDims = true) {
      try {
        const res = await fetch('/store/get_staff_call_items');
        const data = await res.json();
        currentItems = data.items;

        if (updateGridDims) {
          gridRows = data.grid.rows;
          gridCols = data.grid.cols;

          document.getElementById('gridRowsInput').value = gridRows;
          document.getElementById('gridColsInput').value = gridCols;

          updateGridUI();
        }

        renderItems();
      } catch (e) {
        showToast('데이터를 불러오는 중 오류가 발생했습니다.', 'error');
      }
    }

    function updateGridUI() {
      const grid = document.getElementById('itemGrid');
      grid.style.gridTemplateRows = `repeat(${gridRows}, 1fr)`;
      grid.style.gridTemplateColumns = `repeat(${gridCols}, 1fr)`;
    }

    async function applyGridChange() {
      const rows = parseInt(document.getElementById('gridRowsInput').value);
      const cols = parseInt(document.getElementById('gridColsInput').value);

      if (isNaN(rows) || isNaN(cols) || rows < 1 || cols < 1) {
        return showToast('올바른 행과 열 숫자를 입력해주세요.', 'warning');
      }

      // 현재 상태 백업
      const oldRows = gridRows;
      const oldCols = gridCols;

      // 즉시 UI 업데이트 (낙관적 업데이트)
      gridRows = rows;
      gridCols = cols;
      updateGridUI();
      renderItems();

      try {
        const res = await fetchDataAsync('/store/set_staff_call_grid', 'POST', { rows, cols });
        if (res.code === 200) {
          showToast('저장되었습니다.', 'success');
          // 서버 데이터와 동기화를 위해 백그라운드에서 로드 (그리드 설정은 덮어쓰지 않음)
          await loadItems(false);
        } else {
          throw new Error(res.message || '설정 저장 실패');
        }
      } catch (e) {
        // 실패 시 롤백
        gridRows = oldRows;
        gridCols = oldCols;
        document.getElementById('gridRowsInput').value = oldRows;
        document.getElementById('gridColsInput').value = oldCols;
        updateGridUI();
        renderItems();
        showToast('설정 저장 중 오류가 발생했습니다.', 'error');
      }
    }

    function renderItems() {
      const grid = document.getElementById('itemGrid');
      grid.innerHTML = '';

      const itemMap = {};
      currentItems.forEach(item => {
        itemMap[item.position] = item;
      });

      const totalSlots = gridRows * gridCols;

      for (let i = 0; i < totalSlots; i++) {
        const item = itemMap[i];
        const card = document.createElement('div');

        if (item) {
          card.className = 'staff-call-card' + (selectedItemId === item.id ? ' active' : '');
          card.innerHTML = `
            <span class="badge">#${i + 1}</span>
            ${item.image ? `<img src="${item.image}">` : ''}
            <div class="content">
                <span class="name">${item.name}</span>
                ${item.use_quantity ? `<span class="setting_tag">수량 선택</span>` : ''}
            </div>
          `;
          card.onclick = () => selectItem(item);
        } else {
          const isActive = (selectedPosition === i && !selectedItemId);
          card.className = 'staff-call-card empty' + (isActive ? ' active' : '');
          card.innerHTML = `
            <span class="badge">#${i + 1}</span>
            <span class="name">추가</span>
          `;
          card.onclick = () => clickEmptySlot(i);
        }
        grid.appendChild(card);
      }
    }

    function clickEmptySlot(position) {
      resetForm(false); // 렌더링 없이 초기화만
      selectedPosition = position;
      selectedItemId = null;

      document.getElementById('paneTitle').textContent = '항목 추가';
      document.getElementById('itemPosition').value = position;

      const posBadge = document.getElementById('posBadge');
      posBadge.textContent = `#${position + 1}`;
      posBadge.style.display = 'block';

      document.getElementById('deleteBtn').style.display = 'none';
      renderItems();
    }

    function selectItem(item) {
      resetForm(false); // 렌더링 없이 초기화만
      selectedItemId = item.id;
      selectedPosition = item.position;

      document.getElementById('paneTitle').textContent = '항목 수정';
      document.getElementById('itemName').value = item.name;
      document.getElementById('itemPosition').value = item.position;
      document.getElementById('selectedId').value = item.id;
      document.getElementById('useQuantityBtn').dataset.active = item.use_quantity ? 'true' : 'false';

      const posBadge = document.getElementById('posBadge');
      posBadge.textContent = `#${item.position + 1}`;
      posBadge.style.display = 'block';

      const preview = document.getElementById('imagePreview');
      const placeholder = document.getElementById('uploadPlaceholder');
      if (item.image) {
        preview.src = item.image;
        preview.style.display = 'block';
        placeholder.style.display = 'none';
      }

      document.getElementById('deleteBtn').style.display = 'block';
      renderItems();
    }

    function resetForm(shouldRender = true) {
      selectedItemId = null;
      selectedPosition = null;
      selectedImageFile = null;
      document.getElementById('selectedId').value = '';
      document.getElementById('paneTitle').textContent = '항목 추가';
      document.getElementById('itemName').value = '';
      document.getElementById('itemPosition').value = ''; // Clear itemPosition
      document.getElementById('useQuantityBtn').dataset.active = 'false';

      document.getElementById('posBadge').style.display = 'none';

      document.getElementById('imagePreview').src = '';
      document.getElementById('imagePreview').style.display = 'none';
      document.getElementById('uploadPlaceholder').style.display = 'flex';
      document.getElementById('imageInput').value = '';
      document.getElementById('deleteBtn').style.display = 'none';

      if (shouldRender) renderItems();
    }

    function toggleUseQuantity() {
      const btn = document.getElementById('useQuantityBtn');
      btn.dataset.active = btn.dataset.active === 'true' ? 'false' : 'true';
    }

    function handleImageSelect(input) {
      if (input.files && input.files[0]) {
        selectedImageFile = input.files[0];
        const reader = new FileReader();
        reader.onload = function (e) {
          const preview = document.getElementById('imagePreview');
          preview.src = e.target.result;
          preview.style.display = 'block';
          document.getElementById('uploadPlaceholder').style.display = 'none';
        }
        reader.readAsDataURL(selectedImageFile);
      }
    }

    async function saveItem() {
      const name = document.getElementById('itemName').value;
      const position = document.getElementById('itemPosition').value;
      const use_quantity = document.getElementById('useQuantityBtn').dataset.active === 'true';
      const id = document.getElementById('selectedId').value;

      if (!name) return showToast('항목명을 입력해주세요.', 'warning');
      if (position === '') return showToast('슬롯을 먼저 선택해주세요.', 'warning');

      const formData = new FormData();
      formData.append('name', name);
      formData.append('position', position);
      formData.append('use_quantity', use_quantity);
      if (id) formData.append('id', id);
      if (selectedImageFile) formData.append('image_file', selectedImageFile);

      const method = id ? 'PATCH' : 'POST';

      try {
        const res = await fetchDataAsync('/store/set_staff_call_item', method, formData, true);
        if (res.code === 200 || res.code === 201) {
          showToast('저장되었습니다.', 'success');
          await loadItems();
          resetForm();
        } else {
          showToast(res.message || '저장 중 오류가 발생했습니다.', 'error');
        }
      } catch (e) {
        showToast('서버와의 통신에 실패했습니다.', 'error');
      }
    }

    function deleteItem(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      if (!selectedItemId) return;

      const { top, middle, bottom } = openDefaultModal();
      top.innerHTML = modalTopHtml('항목 삭제');
      middle.innerHTML = `
        <p class="setting_confirm">이 항목을 삭제할까요?
          <span>삭제하면 되돌릴 수 없습니다.</span>
        </p>
      `;
      bottom.innerHTML = modalBottomHtml([
        { class: 'gray', text: '취소', fun: 'onclick="removeModal()"' },
        { class: 'red_fill', text: '삭제', fun: 'onclick="confirmDelete()"' }
      ]);
    }

    async function confirmDelete() {
      removeModal();
      if (!selectedItemId) return;

      try {
        const res = await fetchDataAsync(`/store/set_staff_call_item?id=${selectedItemId}`, 'DELETE');
        if (res.code === 200) {
          showToast('삭제되었습니다.', 'success');
          await loadItems();
          resetForm();
        } else {
          showToast(res.message || '삭제 중 오류가 발생했습니다.', 'error');
        }
      } catch (e) {
        showToast('서버와의 통신에 실패했습니다.', 'error');
      }
    }

    // 다중 선택 기능 (이전 테이블 기반 기능으로, 현재 그리드 UI에서는 사용되지 않음)
    function toggleAllCheckboxes(source) {
      const checkboxes = document.querySelectorAll('.item-checkbox');
      checkboxes.forEach(cb => cb.checked = source.checked);
    }

    function clickAllSelectBtn() {
      const headerCheckbox = document.querySelector('.table_header input[type="checkbox"]');
      headerCheckbox.checked = true;
      toggleAllCheckboxes(headerCheckbox);
    }

    function clickAllCancelBtn() {
      const headerCheckbox = document.querySelector('.table_header input[type="checkbox"]');
      headerCheckbox.checked = false;
      toggleAllCheckboxes(headerCheckbox);
    }

    async function deleteSelectedItems() {
      const selectedCheckboxes = document.querySelectorAll('.item-checkbox:checked');
      if (selectedCheckboxes.length === 0) return showToast('삭제할 항목을 선택해주세요.', 'warning');
      if (!confirm(`선택한 ${selectedCheckboxes.length}개의 항목을 정말 삭제하시겠습니까?`)) return;

      const ids = Array.from(selectedCheckboxes).map(cb => cb.value);

      let successCount = 0;
      for (const id of ids) {
        try {
          const res = await fetchDataAsync(`/store/set_staff_call_item?id=${id}`, 'DELETE');
          if (res.code === 200) successCount++;
        } catch (e) {
          console.error(`Error deleting item ${id}:`, e);
        }
      }

      if (successCount > 0) {
        showToast(`${successCount}개의 항목이 삭제되었습니다.`, 'success');
        loadItems();
        resetForm();
      }
    }
  </script>
</body>

</html>
