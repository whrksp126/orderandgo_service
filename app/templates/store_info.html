<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OrderAndGo - 매장 정보 관리</title>
  <link rel="icon" type="image/x-icon" href="/static/images/common/logo.png">

  <link rel="stylesheet" href="/static/css/responsive.css">
  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/common.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    body {
      background-color: #F8F9FA;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      height: 56px;
      padding: 0 20px;
      background: #fff;
      border-bottom: 1px solid #e9ecef;
      gap: 12px;
    }

    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 20px;
      color: #333;
      text-decoration: none;
    }

    .back-btn:hover {
      background: #f1f3f5;
    }

    .page-title {
      font-size: 17px;
      font-weight: 700;
      color: #222;
    }

    main {
      max-width: 560px;
      margin: 32px auto;
      padding: 0 20px;
    }

    .info-card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e9ecef;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .field-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 13px;
      font-weight: 600;
      color: #555;
    }

    .field-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      font-size: 15px;
      color: #222;
      background: #fff;
      box-sizing: border-box;
      transition: border-color .2s;
    }

    .field-input:focus {
      outline: none;
      border-color: #333;
    }

    .field-input::placeholder {
      color: #adb5bd;
    }

    .save-btn {
      width: 100%;
      padding: 15px;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background .2s;
    }

    .save-btn:hover {
      background: #000;
    }

    .save-btn:active {
      background: #444;
    }

    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #222;
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: all .3s;
      white-space: nowrap;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

<body>
  <header>
    <a class="back-btn" href="/" title="뒤로가기">
      <i class="ph-bold ph-caret-left"></i>
    </a>
    <span class="page-title">매장 정보 관리</span>
  </header>

  <main>
    <div class="info-card">
      <div class="field-row">
        <label class="field-label" for="input-business-number">사업자 번호</label>
        <input
          class="field-input"
          id="input-business-number"
          type="text"
          placeholder="000-00-00000"
          value="{{ store_data.business_number }}"
        >
      </div>

      <div class="field-row">
        <label class="field-label" for="input-representative">대표자</label>
        <input
          class="field-input"
          id="input-representative"
          type="text"
          placeholder="대표자명"
          value="{{ store_data.representative_name }}"
        >
      </div>

      <div class="field-row">
        <label class="field-label" for="input-address">주소</label>
        <input
          class="field-input"
          id="input-address"
          type="text"
          placeholder="매장 주소"
          value="{{ store_data.address }}"
        >
      </div>

      <div class="field-row">
        <label class="field-label" for="input-tel">전화번호</label>
        <input
          class="field-input"
          id="input-tel"
          type="text"
          placeholder="000-0000-0000"
          value="{{ store_data.tel }}"
        >
      </div>

      <button class="save-btn" onclick="saveStoreInfo()">저장</button>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const showToast = (msg, isError = false) => {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.background = isError ? '#e03131' : '#222';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    };

    const saveStoreInfo = () => {
      const data = {
        business_number: document.getElementById('input-business-number').value.trim(),
        representative_name: document.getElementById('input-representative').value.trim(),
        address: document.getElementById('input-address').value.trim(),
        tel: document.getElementById('input-tel').value.trim(),
      };

      fetch('/store/update_store_info', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      })
        .then(res => res.json())
        .then(result => {
          if (result.code === 200) {
            showToast('저장되었습니다.');
          } else {
            showToast(result.msg || '저장에 실패했습니다.', true);
          }
        })
        .catch(() => showToast('저장에 실패했습니다.', true));
    };
  </script>
</body>

</html>
