<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OrderAndGo · 매장 정보 관리</title>
  <link rel="icon" type="image/x-icon" href="/static/images/common/logo.png">

  <link rel="stylesheet" href="/static/css/responsive.css">
  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/common.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/animation.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="/static/css/store.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/store_settings.css?v={{ static_v }}">
  <!-- 다음 우편번호 서비스 (무료, API키 불필요) -->
  <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
</head>

<body class="setting_page setting_form_page store_info_page">
  <div id="container">
    <header>
      <a class="back_btn" href="/dashboard">
        <i class="ph-bold ph-caret-left"></i>
      </a>
      <div class="center">
        <a onclick="location.reload();">
          <h1><img src="/static/images/common/logo-order&go-white.png" alt=""></h1>
        </a>
        <div class="header_info">
          <span class="cur_time"></span>
          <span class="store_state" data-state="open">영업중</span>
        </div>
      </div>
    </header>

    <main>
      <div class="setting_row">
        <h2>사업자 번호</h2>
        <div class="setting_field">
          <input class="setting_input" id="input-business-number" type="text" inputmode="numeric"
            placeholder="000-00-00000" maxlength="12" value="{{ store_data.business_number }}">
          <span class="setting_error" id="err-business-number">사업자 번호 형식이 올바르지 않습니다. (예: 123-45-67890)</span>
        </div>
      </div>
      <div class="setting_row">
        <h2>대표자</h2>
        <div class="setting_field">
          <input class="setting_input" id="input-representative" type="text" placeholder="대표자명" maxlength="30"
            value="{{ store_data.representative_name }}">
          <span class="setting_error" id="err-representative">한글 또는 영문만 입력해주세요.</span>
        </div>
      </div>
      <div class="setting_row">
        <h2>주소</h2>
        <div class="setting_field">
          <div class="setting_line">
            <input class="setting_input" id="input-address-road" type="text" placeholder="도로명 주소" readonly
              onclick="openAddressSearch()">
            <button class="setting_btn brand" type="button" onclick="openAddressSearch()">검색</button>
          </div>
          <input class="setting_input" id="input-address-detail" type="text" placeholder="상세 주소" maxlength="100">
          <span class="setting_error" id="err-address">도로명 주소를 검색해주세요.</span>
        </div>
      </div>
      <div class="setting_row">
        <h2>전화번호</h2>
        <div class="setting_field">
          <input class="setting_input" id="input-tel" type="text" inputmode="numeric" placeholder="02-1234-5678"
            maxlength="14" value="{{ store_data.tel }}">
          <span class="setting_error" id="err-tel">전화번호 형식이 올바르지 않습니다. (예: 02-1234-5678)</span>
        </div>
      </div>
      <div class="setting_row">
        <h2>영업일 초기화 시각</h2>
        <div class="setting_field">
          <input class="setting_input short" id="input-business-cutoff" type="time"
            value="{{ store_data.business_day_cutoff }}">
          <p class="setting_note">이 시각에 영업일이 바뀝니다. 자정을 넘긴 주문도 이 시각 전까지는 전날 영업일로 집계됩니다.</p>
        </div>
      </div>
      <div class="setting_row">
        <h2></h2>
        <div class="setting_field">
          <div class="setting_line">
            <button class="setting_btn fill large" onclick="saveStoreInfo()">저장</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/static/js/common.js?v={{ static_v }}"></script>
  <script src="/static/js/device-notice.js?v={{ static_v }}"></script>
  <script>
    /* ── 초기값 주소 분리 세팅 ──
       저장된 address를 "도로명주소 | 상세주소" 구분자로 처리 */
    (() => {
      const saved = '{{ store_data.address | e }}';
      if (!saved) return;
      const sep = saved.indexOf(' | ');
      if (sep !== -1) {
        document.getElementById('input-address-road').value = saved.slice(0, sep);
        document.getElementById('input-address-detail').value = saved.slice(sep + 3);
      } else {
        document.getElementById('input-address-road').value = saved;
      }
    })();

    /* ── 다음 우편번호 서비스 ── */
    const openAddressSearch = () => {
      new daum.Postcode({
        oncomplete: (data) => {
          // 도로명 주소 우선, 없으면 지번 주소
          const road = data.roadAddress || data.jibunAddress;
          document.getElementById('input-address-road').value = road;
          document.getElementById('input-address-detail').value = '';
          document.getElementById('input-address-detail').focus();
          clearError('input-address-road', 'err-address');
        },
      }).open();
    };

    /* ── 사업자 번호 자동 포맷 (000-00-00000) ── */
    document.getElementById('input-business-number').addEventListener('input', function () {
      const digits = this.value.replace(/\D/g, '').slice(0, 10);
      let formatted = digits;
      if (digits.length > 5) {
        formatted = digits.slice(0, 3) + '-' + digits.slice(3, 5) + '-' + digits.slice(5);
      } else if (digits.length > 3) {
        formatted = digits.slice(0, 3) + '-' + digits.slice(3);
      }
      this.value = formatted;
      clearError('input-business-number', 'err-business-number');
    });

    /* ── 대표자 : 한글/영문/공백만 허용 (IME 조합 중에는 필터 건너뜀) ── */
    let isComposing = false;
    const repInput = document.getElementById('input-representative');
    repInput.addEventListener('compositionstart', () => { isComposing = true; });
    repInput.addEventListener('compositionend', function () {
      isComposing = false;
      this.value = this.value.replace(/[^가-힣a-zA-Z\s]/g, '');
      clearError('input-representative', 'err-representative');
    });
    repInput.addEventListener('input', function () {
      if (isComposing) return;
      this.value = this.value.replace(/[^가-힣a-zA-Z\s]/g, '');
      clearError('input-representative', 'err-representative');
    });

    /* ── 전화번호 자동 포맷 ── */
    document.getElementById('input-tel').addEventListener('input', function () {
      const digits = this.value.replace(/\D/g, '').slice(0, 11);
      let formatted = digits;
      if (digits.startsWith('02')) {
        // 서울 (02): 02-XXX-XXXX 또는 02-XXXX-XXXX
        if (digits.length > 6) {
          formatted = digits.slice(0, 2) + '-' + digits.slice(2, digits.length - 4) + '-' + digits.slice(-4);
        } else if (digits.length > 2) {
          formatted = digits.slice(0, 2) + '-' + digits.slice(2);
        }
      } else {
        // 그 외 (010, 031, 070 등): XXX-XXXX-XXXX 또는 XXX-XXX-XXXX
        if (digits.length > 7) {
          formatted = digits.slice(0, 3) + '-' + digits.slice(3, digits.length - 4) + '-' + digits.slice(-4);
        } else if (digits.length > 3) {
          formatted = digits.slice(0, 3) + '-' + digits.slice(3);
        }
      }
      this.value = formatted;
      clearError('input-tel', 'err-tel');
    });

    /* ── 유효성 검사 ── */
    const VALIDATORS = {
      'input-business-number': {
        regex: /^\d{3}-\d{2}-\d{5}$/,
        errId: 'err-business-number',
        allowEmpty: true,
      },
      'input-representative': {
        regex: /^[가-힣a-zA-Z\s]+$/,
        errId: 'err-representative',
        allowEmpty: true,
      },
      'input-tel': {
        regex: /^\d{2,3}-\d{3,4}-\d{4}$/,
        errId: 'err-tel',
        allowEmpty: true,
      },
    };

    const showError = (inputId, errId) => {
      document.getElementById(inputId).classList.add('error');
      document.getElementById(errId).classList.add('show');
    };

    const clearError = (inputId, errId) => {
      document.getElementById(inputId).classList.remove('error');
      document.getElementById(errId).classList.remove('show');
    };

    const validate = () => {
      let valid = true;
      for (const [inputId, rule] of Object.entries(VALIDATORS)) {
        const val = document.getElementById(inputId).value.trim();
        if (val === '' && rule.allowEmpty) { clearError(inputId, rule.errId); continue; }
        if (!rule.regex.test(val)) { showError(inputId, rule.errId); valid = false; }
        else { clearError(inputId, rule.errId); }
      }
      return valid;
    };

    /* ── 저장 ── */
    const saveStoreInfo = () => {
      if (!validate()) {
        showToast('입력 내용을 확인해주세요.', 'error');
        return;
      }

      const road = document.getElementById('input-address-road').value.trim();
      const detail = document.getElementById('input-address-detail').value.trim();
      const address = road && detail ? `${road} | ${detail}` : road;

      const data = {
        business_number: document.getElementById('input-business-number').value.trim(),
        representative_name: document.getElementById('input-representative').value.trim(),
        address,
        tel: document.getElementById('input-tel').value.trim(),
        business_day_cutoff: document.getElementById('input-business-cutoff').value.trim(),
      };

      fetch('/store/update_store_info', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      })
        .then(res => res.json())
        .then(result => {
          if (result.code === 200) showToast('저장되었습니다.', 'success');
          else showToast(result.msg || '저장에 실패했습니다.', 'error');
        })
        .catch(() => showToast('저장에 실패했습니다.', 'error'));
    };
  </script>
</body>

</html>
