<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OrderAndGo - 주방 주문 관리</title>
  <link rel="icon" type="image/x-icon" href="/static/images/common/logo.png">
  <link rel="apple-touch-icon" href="/static/images/common/apple-touch-icon.png?v=2">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1FAA9C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/animation.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <link rel="stylesheet" href="/static/css/store.css">
  <style>
    /* POS 테이블 목록과 동일한 밝은 보드 + 화이트 카드 스타일 */
    .kds-select body,
    body.kds-select {
      background: #f8f9fa;
    }

    body.kds-select main {
      min-height: calc(100dvh - 40px);
      padding: 20px;
      background: #f8f9fa;
      display: block;
    }

    /* store.css(.set_menu_product main>*)가 자식에 씌우는 흰 패널 제거 → POS처럼 카드가 보드에 바로 놓임 */
    body.kds-select main > * {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0;
    }

    .kds-select-wrap {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .kds-station-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    /* POS view-card 룩: 흰 카드, 10px 라운드, 얇은 테두리, 이름만 표시 */
    .kds-station-card {
      background: #fff;
      border: 1.5px solid #d5d8de;
      border-radius: 10px;
      padding: 20px;
      min-height: 120px;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.1s;
      display: flex;
      flex-direction: column;
    }

    .kds-station-card:hover {
      border-color: #1FAA9C;
    }

    .kds-station-card:active {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    .kds-station-name {
      font-size: 20px;
      font-weight: 700;
      color: #222;
    }

    /* 빈 상태 */
    .kds-empty {
      text-align: center;
      padding: 60px 20px;
      color: #ccc;
    }

    .kds-empty i {
      font-size: 56px;
      display: block;
      margin-bottom: 16px;
    }

    .kds-empty p {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #bbb;
    }

    .kds-empty small {
      font-size: 13px;
      color: #ccc;
    }

    .btn-goto-mgmt {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
      padding: 12px 24px;
      background: #1FAA9C;
      color: #fff;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      transition: background 0.2s;
    }

    .btn-goto-mgmt:hover {
      background: #178a7e;
    }
  </style>
</head>

<body class="kds-select set_menu_product">
  <div id="container">
    <header>
      <a class="back_btn" href="/dashboard">
        <i class="ph-bold ph-caret-left"></i>
      </a>
      <div class="center">
        <a onclick="location.reload();">
          <h1>
            <img src="/static/images/common/logo-order&go-white.png" alt="">
          </h1>
        </a>
        <div class="header_info">
          <span class="cur_time"></span>
          <span class="store_state" data-state="open">영업중</span>
        </div>
      </div>
    </header>

    <main>
      <div class="kds-select-wrap">
        {% if stations %}
        <div class="kds-station-grid">
          {% for s in stations %}
          <div class="kds-station-card" onclick="location.href='/kds/station/{{ s.id }}'">
            <div class="kds-station-name">{{ s.name }}</div>
          </div>
          {% endfor %}
        </div>
        {% else %}
        <div class="kds-empty">
          <i class="ph ph-cooking-pot"></i>
          <p>등록된 스테이션이 없습니다</p>
          <small>매장 관리에서 KDS 스테이션을 먼저 설정해주세요</small><br>
          <a href="/store/kds_station_mgmt" class="btn-goto-mgmt">
            <i class="ph ph-gear"></i>
            스테이션 설정하기
          </a>
        </div>
        {% endif %}
      </div>
    </main>
  </div>

  <script src="/static/js/og_sound.js?v=10"></script>
  <script src="/static/js/common.js?v=4"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      updateTime();
      setInterval(updateTime, 1000);
    });

    function updateTime() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      document.querySelector('.cur_time').textContent =
        `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }
  </script>
</body>

</html>
