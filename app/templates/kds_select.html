<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OrderAndGo - 주문 접수</title>
  <link rel="icon" type="image/x-icon" href="/static/images/common/logo.png">
  <link rel="apple-touch-icon" href="/static/images/common/apple-touch-icon.png?v=2">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1FAA9C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/animation.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <link rel="stylesheet" href="/static/css/store.css?v={{ static_v }}">
  <style>
    /* 매장 관리(/store/product)와 같은 규격: 회색 바탕, 왼쪽 제목 + 흰 테두리 버튼 목록 */
    body.kds-select main {
      display: block;
      height: calc(100vh - 40px);
      height: calc(100dvh - 40px);
      padding: 20px;
      overflow-y: auto;
      background: #F5F5F5;
    }
    .kds-select-row {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      padding: 20px 0;
    }
    .kds-select-row h2 {
      width: 150px;
      padding-top: 15px;
      color: #000;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.25;
    }
    .kds-select-list {
      flex: 1 1 0;
      min-width: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }
    .kds-select-list a {
      display: flex;
      align-items: center;
      min-height: 50px;
      padding: 12px;
      border-radius: 5px;
      border: 1px solid #CCC;
      background: #FFF;
      color: #000;
      font-size: 14px;
      font-weight: 600;
      transition: border-color 0.15s, background 0.15s;
    }
    .kds-select-list a:hover { border-color: #1FAA9C; }
    .kds-select-list a:active { background: #F3FAFA; }
    .kds-select-empty {
      grid-column: 1 / -1;
      padding-top: 15px;
      color: #666;
      font-size: 14px;
      line-height: 1.25;
    }
    @media (max-width: 700px) {
      .kds-select-row { flex-direction: column; gap: 12px; }
      .kds-select-row h2 { width: auto; padding-top: 0; }
      .kds-select-list { width: 100%; grid-template-columns: minmax(0, 1fr); gap: 10px; }
      .kds-select-empty { padding-top: 0; }
    }
  </style>
</head>

<body class="kds-select">
  <div id="container">
    <header>
      <a class="back_btn" href="/dashboard">
        <i class="ph-bold ph-caret-left"></i>
      </a>
      <div class="center">
        <a onclick="location.reload();">
          <h1>
            <img src="/static/images/common/logo-order&go-white.png" alt="">
          </h1>
        </a>
        <div class="header_info">
          <span class="cur_time"></span>
          <span class="store_state" data-state="open">영업중</span>
        </div>
      </div>
    </header>

    <main>
      <div class="kds-select-row">
        <h2>주문 접수</h2>
        <div class="kds-select-list">
          {% if stations %}
          {% for s in stations %}
          <a href="/kds/station/{{ s.id }}">{{ s.name }}</a>
          {% endfor %}
          {% else %}
          <p class="kds-select-empty">등록된 스테이션이 없습니다.</p>
          <a href="/store/kds_station_mgmt">스테이션 설정</a>
          {% endif %}
        </div>
      </div>
    </main>
  </div>

  <script src="/static/js/og_sound.js?v=10"></script>
  <script src="/static/js/common.js?v={{ static_v }}"></script>
  <script src="/static/js/device-notice.js?v={{ static_v }}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      updateTime();
      setInterval(updateTime, 1000);
    });

    function updateTime() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      document.querySelector('.cur_time').textContent =
        `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }
  </script>
</body>

</html>
