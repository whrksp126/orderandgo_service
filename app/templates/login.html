{% extends "auth_layout.html" %}
{% block title %}로그인 — 오더앤고{% endblock %}
{% block robots %}index, follow{% endblock %}

{% block auth %}
<h1 class="au-title">로그인</h1>

<div class="au-seg" id="loginTabs" role="tablist">
  <span class="au-seg-thumb" aria-hidden="true"></span>
  <button type="button" class="au-seg-btn active" data-tab="owner" role="tab" aria-selected="true">사장님 로그인</button>
  <button type="button" class="au-seg-btn" data-tab="device" role="tab" aria-selected="false">매장 로그인</button>
</div>

<!-- 사장님 로그인: 휴대폰 번호 -->
<form id="form_owner" class="au-form" data-panel="owner" novalidate>
  <label class="au-field">
    <span class="au-label">휴대폰 번호</span>
    <span class="au-input">
      <input type="tel" id="owner_tel" class="js-tel" inputmode="numeric" autocomplete="username" placeholder="010-0000-0000" maxlength="13" enterkeyhint="next">
    </span>
  </label>
  <label class="au-field">
    <span class="au-label">비밀번호</span>
    <span class="au-input">
      <input type="password" id="owner_password" autocomplete="current-password" placeholder="비밀번호" enterkeyhint="go">
      <button type="button" class="au-eye js-eye" aria-label="비밀번호 보기"><i class="ph ph-eye"></i></button>
    </span>
  </label>
  <div class="au-msg" id="msg_owner" role="alert"></div>
  <button type="submit" class="au-btn" disabled><span class="au-btn-label">로그인</span></button>
  <div class="au-links"><a href="/find_password">비밀번호를 잊으셨나요?</a></div>
</form>

<!-- 매장 로그인: 매장 아이디 (해당 매장으로 바로 입장) -->
<form id="form_device" class="au-form" data-panel="device" novalidate hidden>
  <label class="au-field">
    <span class="au-label">매장 아이디</span>
    <span class="au-input">
      <input type="text" id="store_id" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="매장 아이디" enterkeyhint="next">
    </span>
  </label>
  <label class="au-field">
    <span class="au-label">비밀번호</span>
    <span class="au-input">
      <input type="password" id="store_password" autocomplete="current-password" placeholder="비밀번호" enterkeyhint="go">
      <button type="button" class="au-eye js-eye" aria-label="비밀번호 보기"><i class="ph ph-eye"></i></button>
    </span>
  </label>
  <div class="au-msg" id="msg_device" role="alert"></div>
  <button type="submit" class="au-btn" disabled><span class="au-btn-label">로그인</span></button>
</form>

<div class="au-foot">아직 계정이 없으신가요? <a href="/register_admin">회원가입</a></div>
{% endblock %}
