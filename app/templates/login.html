<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>orderandgo</title>
  <link rel="icon" type="image/x-icon" href="/static/images/common/logo.png">
  <link rel="stylesheet" href="/static/css/responsive.css">
  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/animation.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="/static/css/login.css">
</head>
<body class="login">
  <div id="app">
    <main>
      <h1>
        <a href=""><img src="/static/images/common/logo-order&go-color.png" alt=""></a>
      </h1>

      {% if store_list is defined %}

        <!-- ── 모드 3: 관리자 세션 → 매장 선택 ── -->
        <div class="login_tabs">
          <span class="tab_label active">매장 선택</span>
        </div>

        <form id="form_store_select" onsubmit="onSubmitStoreSelect(event)">
          {% if store_list %}
            <select id="store_select" required>
              {% for store in store_list %}
                <option value="{{ store.store_id }}">{{ store.name }}</option>
              {% endfor %}
            </select>
            <div class="form_msg" id="form_msg"></div>
            <input type="submit" value="매장 입장">
          {% else %}
            <div id="no_store_wrap">
              <p>등록된 매장이 없습니다.</p>
              <a href="/store/create">+ 매장 생성하기</a>
            </div>
          {% endif %}
          <div class="bottom_links center">
            <a href="/store/create">매장 생성</a>
          </div>
        </form>

      {% else %}

        <!-- ── 탭 버튼 ── -->
        <div class="login_tabs">
          <button type="button" id="tab_store" class="active" onclick="showTab('store')">매장 로그인</button>
          <span class="divider">|</span>
          <button type="button" id="tab_admin" onclick="showTab('admin')">관리자 로그인</button>
        </div>

        <!-- ── 모드 1: 매장 로그인 ── -->
        <form id="form_store" onsubmit="onSubmitStoreLogin(event)">
          <input type="text" id="store_id" placeholder="매장 아이디를 입력해주세요" autocomplete="username" required>
          <div class="password_box">
            <input type="password" id="store_password" placeholder="비밀번호를 입력해주세요" autocomplete="current-password" required>
            <button type="button" class="not_btn_box" onclick="clickToggleShowPassword(event)">
              <i class="ph ph-eye"></i>
              <i class="ph ph-eye-slash"></i>
            </button>
          </div>
          <div class="form_msg" id="form_store_msg"></div>
          <input type="submit" value="로그인" disabled>
          <div class="bottom_links">
            <a href="/register_admin">회원가입</a>
            <a href="/find_password">비밀번호 찾기</a>
          </div>
        </form>

        <!-- ── 모드 2: 관리자 로그인 ── -->
        <form id="form_admin" class="hidden" onsubmit="onSubmitAdminLogin(event)">
          <div class="tel_box">
            <input type="tel" data-index="0" maxlength="3" oninput="changeInputTel(event)" placeholder="010" required>
            <span>-</span>
            <input type="tel" data-index="1" maxlength="4" oninput="changeInputTel(event)" placeholder="0000" required>
            <span>-</span>
            <input type="tel" data-index="2" maxlength="4" placeholder="0000" required>
          </div>
          <div class="password_box">
            <input type="password" id="admin_password" placeholder="비밀번호를 입력해주세요" autocomplete="current-password" required>
            <button type="button" class="not_btn_box" onclick="clickToggleShowPassword(event)">
              <i class="ph ph-eye"></i>
              <i class="ph ph-eye-slash"></i>
            </button>
          </div>
          <div class="form_msg" id="form_admin_msg"></div>
          <input type="submit" value="관리자 로그인" disabled>
          <div class="bottom_links">
            <a href="/register_admin">회원가입</a>
            <a href="/find_password">비밀번호 찾기</a>
          </div>
        </form>

      {% endif %}

    </main>
    <aside></aside>
  </div>
  <div class="toast_wrap" id="toast_wrap"></div>

  <script src="/static/js/login.js"></script>
</body>
</html>
