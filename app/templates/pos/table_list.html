<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OrderAndGo</title>
  <link rel="icon" type="image/x-icon" href="/static/images/common/logo.png">

  <!-- 시작 초기 css 설정 -->
  <link rel="stylesheet" href="/static/css/responsive.css">
  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/animation.css">
  <!-- 아이콘 -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- 전용 css -->
  <link rel="stylesheet" href="/static/css/pos.css">
  <link rel="stylesheet" href="/static/css/canvas.css">

  <!-- socket.io -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>

</head>

<body>
  <div id="container">
    <header>
      <!-- <h1>POS - Header</h1>-->
      <a class="back_btn" href="/">
        <i class="ph-bold ph-caret-left"></i>
      </a>
      <div class="center">
        <a onclick="location.reload();">
          <h1>
            <img src="/static/images/common/logo-order&go-white.png" alt="">
          </h1>
        </a>
        <div class="header_info">
          <span class="cur_time">2023-05-01(월) 14:00</span>
          <span class="store_state" data-state="open">영업 중</span>
          <button class="btn_alarm" onclick="toggleNotificationSidebar()">
            <i class="ph ph-bell"></i>
          </button>
        </div>
      </div>
    </header>
    <main>
      <section>
        <!-- <h1>POS - section</h1> -->
        <nav>
          <!-- <h1>POS - Nav</h1> -->
          <ul></ul>
          <button class="btn_set" onclick="clickSetBtn(event)">
            <i class="ph ph-gear-six"></i>
          </button>
        </nav>

        <article>
          <div class="table-canvas-wrap">
            <div class="canvas-scroll-wrap">
              <div id="table-canvas"></div>
            </div>
          </div>
        </article>
        <!-- 메뉴판 페이지에서 메뉴 옵션 선택 영역 -->
        <aside></aside>
      </section>
      <!-- 메뉴판 페이지에서 장바구니 영역 -->
      <aside style="display:none">
        <h1>POS - aside</h1>
      </aside>
    </main>
  </div>

  <!-- 알림 내역 사이드바 -->
  <div id="notificationOverlay" class="notification-overlay" onclick="toggleNotificationSidebar()"></div>
  <aside id="notificationSidebar" class="notification-sidebar">
    <div class="sidebar-header">
      <h2>알림 <span class="dot"></span></h2>
      <button class="close-btn" onclick="toggleNotificationSidebar()">
        <i class="ph ph-x"></i>
      </button>
    </div>
    <div class="sidebar-body">
      <ul id="notificationList">
        <!-- 알림 아이템이 여기에 동적으로 추가됩니다 -->
      </ul>
    </div>
  </aside>

  <div id="toastContainer" class="toast-container"></div>

  <!-- 공통 스크립트 -->
  <script src="/static/js/common.js?v=2"></script>
  <!-- 전용 스크립트 -->
  <script src="/static/js/tableList.js?v=2"></script>
</body>

</html>
