<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OrderAndGo</title>
  <link rel="icon" type="image/x-icon" href="/static/images/common/logo.png">
  <link rel="apple-touch-icon" href="/static/images/common/apple-touch-icon.png?v=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="/static/js/kiosk_fullscreen.js?v=3"></script>

  <!-- 시작 초기 css 설정 -->
  <link rel="stylesheet" href="/static/css/responsive.css?v=2">
  <link rel="stylesheet" href="/static/css/reset.css?v=2">
  <link rel="stylesheet" href="/static/css/common.css?v=2">
  <link rel="stylesheet" href="/static/css/animation.css?v=4">

  <!-- 아이콘 (로컬 최적화) -->
  <link rel="stylesheet" href="/static/css/phosphor/bold.css?v=2">
  <link rel="stylesheet" href="/static/css/phosphor/regular.css?v=2">
  <link rel="stylesheet" href="/static/css/phosphor/fill.css?v=2">

  <script src="/static/js/htmls.js"></script>

  <!-- 전용 css -->
  <link rel="stylesheet" href="/static/css/pos.css?v=4">
  <link rel="stylesheet" href="/static/css/canvas.css?v=3">
  <link rel="stylesheet" href="/static/css/receipt.css?v=2">

  <!-- 외부 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"
    integrity="sha512-q/dWJ3kcmjBLU4Qc47E4A9kTB4m3wuTY7vkFJDTZKjTs8jhyGQnaUrxa0Ytd0ssMZhbNua9hE+E7Qv1j+DyZwA=="
    crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
  <script src="https://unpkg.com/receiptline/lib/receiptline.js"></script>
</head>

<body>
  <div id="container">
    <header>
      <a class="back_btn" id="posBackBtn">
        <i class="ph-bold ph-caret-left"></i>
      </a>
      <div class="center">
        <a id="posLogoBtn">
          <h1>
            <img src="/static/images/common/logo-order&go-white.png" alt="">
          </h1>
        </a>
        <div class="header_info">
          <span class="cur_time">2023-05-01(월) 14:00</span>
          <span class="store_state" data-state="open">영업 중</span>
          <button class="btn_alarm" onclick="toggleNotificationSidebar()" style="display:none">
            <i class="ph ph-bell"></i>
          </button>
        </div>
      </div>
    </header>
    <main id="pos-content">
    </main>
  </div>

  <!-- 알림 내역 사이드바 (임시 숨김) -->
  <div id="notificationOverlay" class="notification-overlay" onclick="toggleNotificationSidebar()" style="display:none"></div>
  <aside id="notificationSidebar" class="notification-sidebar" style="display:none">
    <div class="sidebar-header">
      <h2>알림 <span class="dot"></span></h2>
      <button class="close-btn" onclick="toggleNotificationSidebar()">
        <i class="ph ph-x"></i>
      </button>
    </div>
    <div class="sidebar-body">
      <ul id="notificationList">
      </ul>
    </div>
  </aside>

  <div id="toastContainer" class="toast-container"></div>

  <!-- 직원 요청 및 호출에 대한 처리 영역 -->
  <div id="alarm"></div>

  <!-- 사운드 피드백 -->
  <script src="/static/js/og_sound.js?v=2"></script>
  <!-- 공통 스크립트 -->
  <script src="/static/js/common.js?v=4"></script>
  <!-- SPA 라우터 -->
  <script src="/static/js/posRouter.js?v=5"></script>
  <!-- 전용 스크립트 -->
  <script src="/static/js/tableList.js?v=5"></script>
  <script src="/static/js/menuList.js?v=13"></script>
  <script src="/static/js/payment.js?v=10"></script>
  <script src="/static/js/receipt.js?v=5"></script>
  <script src="/static/js/printer.js?v=2"></script>
</body>

</html>
