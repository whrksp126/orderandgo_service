<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OrderAndGo</title>
  <link rel="icon" type="image/x-icon" href="/static/images/common/logo.png">

  <!-- 시작 초기 css 설정 -->
  <link rel="stylesheet" href="/static/css/responsive.css">
  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/animation.css">

  <script src="/static/js/htmls.js"></script>
  <!-- 아이콘 -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- 전용 css -->
  <link rel="stylesheet" href="/static/css/pos.css">
</head>

<body>
  <div id="container" class="order">
    <header>
      <!-- <h1>POS - Header</h1>-->
      <a class="back_btn" href="/pos/tableList">
        <i class="ph-bold ph-caret-left"></i>
      </a>
      <div class="center">
        <a onclick="location.reload();">
          <h1>
            <img src="/static/images/common/logo-order&go-white.png" alt="">
          </h1>
        </a>
        <div class="header_info">
          <span class="cur_time">2023-05-01(월) 14:00</span>
          <span class="store_state" data-state="open">영업중</span>
          <button class="btn_alarm" onclick="toggleNotificationSidebar()">
            <i class="ph ph-bell"></i>
          </button>
        </div>
      </div>
    </header>
    <main>
      <section>
        <!-- <h1>POS - section</h1> -->
        <nav class="main">
          <!-- <h1>POS - Nav</h1> -->
          <ul>
            <li data-state="active">
              <button>카테고리 1</button>
            </li>
            <li>
              <button>카테고리 2</button>
            </li>
            <li>
              <button>카테고리 3</button>
            </li>
          </ul>
        </nav>
        <nav class="sub">
          <!-- <h1>POS - Nav</h1> -->
          <ul>
            <li data-state="active">
              <button>카테고리 1</button>
            </li>
            <li>
              <button>카테고리 2</button>
            </li>
            <li>
              <button>카테고리 3</button>
            </li>
          </ul>
        </nav>
        <article>
          <div class="menus items">
            <button class="menu item">
              <div class="title">
                <h2>메뉴명</h2>
              </div>
              <span class="price">16,000원</span>
            </button>
            <button class="menu item hidden"></button>
            <button class="menu item hidden"></button>
            <button class="menu item hidden"></button>

            <button class="menu item hidden"></button>
            <button class="menu item hidden"></button>
            <button class="menu item hidden"></button>
            <button class="menu item hidden"></button>

            <button class="menu item hidden"></button>
            <button class="menu item hidden"></button>
            <button class="menu item hidden"></button>
            <button class="menu item hidden"></button>

            <button class="menu item hidden"></button>
            <button class="menu item hidden"></button>
            <button class="menu item hidden"></button>
            <button class="menu item hidden"></button>

            <button class="menu item hidden"></button>
            <button class="menu item hidden"></button>
            <button class="menu item hidden"></button>
            <button class="menu item hidden"></button>

            <button class="menu item hidden"></button>
            <button class="menu item hidden"></button>
            <button class="menu item hidden"></button>
            <button class="menu item hidden"></button>
          </div>
          <button class="change_page_btn prev_page_btn" onclick="clickChageMenuListPageBtn(event, 'prev')">
            <i class="ph ph-caret-left"></i>
          </button>
          <button class="change_page_btn next_page_btn" onclick="clickChageMenuListPageBtn(event, 'next')">
            <i class="ph ph-caret-right"></i>
          </button>
        </article>
        <!-- 옵션 선택 모달 (POS 전용 - 이미지 제외) -->
        <div class="option-modal-overlay" id="optionModal">
          <div class="option-modal pos-modal">
            <!-- POS에서는 이미지 영역(.left-side) 제거 -->
            <div class="right-side">
              <div class="details">
                <h2 id="optionMenuName">메뉴명</h2>
                <div class="price" id="optionMenuPrice">0원</div>
                <!-- 필요한 경우 설명 표시, 없으면 숨김 -->
                <div id="optionMenuDescription" class="menu-description"></div>

                <div id="optionGroups">
                  <!-- 옵션 그룹들 동적 생성 -->
                </div>
              </div>
              <div class="actions">
                <button class="cancel-btn" onclick="closeOptionModal()">취소</button>
                <button class="add-to-cart-btn" onclick="addToCartFromModal()">장바구니 담기</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 기존 옵션 컨테이너 제거됨 -->
      </section>
      <!-- 메뉴판 페이지에서 장바구니 영역 -->
      <aside class="basket_container" data-type="basket">
        <!-- <h1>POS - aside</h1> -->
        <div class="count_btns top">
          <button onclick="minusBasketMenu(event)" data-active="false" class="minus">
            <i class="ph ph-minus"></i>
          </button>
          <button onclick="plusBasketMenu(event)" data-active="false" class="plus">
            <i class="ph ph-plus"></i>
          </button>
          <button onclick="deleteBasketMenu(event)" class="delete">
            <i class="ph ph-trash"></i>
          </button>
          <button onclick="clickOrderHistoryBtn(event)" data-check="false" class="order_history">
            주문내역
          </button>
        </div>
        <ul class="basket middle">
          <!-- <li>
            <div class="menu">
              <h2>메뉴명</h2>
              <span>1</span>
              <span class="price">18,000원</span>
            </div>
            <div class="menu_option">
              <h2>옵션명</h2>
              <span>1</span>
              <span class="price">2,000원</span>
            </div>
          </li> -->
        </ul>
        <div class="order_btns bottom">
          <div class="total_price">
            <h2>총액</h2>
            <span class="price">원</span>
          </div>

          <!-- 토스트 메시지 컨테이너 -->
          <div id="toastContainer" class="toast-container"></div>
          <ul>
            <li class="order" data-iscancel="false" onclick="clickOrder(event)"><button>주문하기</button></li>
            <li class="pay" onclick="clickPayment(event)"><button>결제하기</button></li>
          </ul>
        </div>
      </aside>
    </main>
  </div>

  <!-- 알림 내역 사이드바 -->
  <div id="notificationOverlay" class="notification-overlay" onclick="toggleNotificationSidebar()"></div>
  <aside id="notificationSidebar" class="notification-sidebar">
    <div class="sidebar-header">
      <h2>알림 <span class="dot"></span></h2>
      <button class="close-btn" onclick="toggleNotificationSidebar()">
        <i class="ph ph-x"></i>
      </button>
    </div>
    <div class="sidebar-body">
      <ul id="notificationList">
        <!-- 알림 아이템이 여기에 동적으로 추가됩니다 -->
      </ul>
    </div>
  </aside>

  <!-- 직원 요청 및 호출에 대한 처리 영역 -->
  <div id="alarm"></div>

  <!-- 공통 스크립트 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"
    integrity="sha512-q/dWJ3kcmjBLU4Qc47E4A9kTB4m3wuTY7vkFJDTZKjTs8jhyGQnaUrxa0Ytd0ssMZhbNua9hE+E7Qv1j+DyZwA=="
    crossorigin="anonymous"></script>
  <script src="/static/js/common.js?v=2"></script>
  <!-- 전용 스크립트 -->
  <script src="/static/js/menuList.js?v=2"></script>
</body>

</html>
