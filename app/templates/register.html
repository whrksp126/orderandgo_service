<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>orderandgo</title>
  <link rel="icon" type="image/x-icon" href="/static/images/common/logo.png">

  <!-- 시작 초기 css 설정 -->
  <link rel="stylesheet" href="/static/css/responsive.css">
  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/animation.css">
  <!-- 아이콘 -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- 전용 css -->
  <link rel="stylesheet" href="/static/css/login.css">
</head>
<body class="register">
  <div id="app">

    <main>
      <h1><a href="/"><img src="/static/images/common/logo-order&go-color.png" alt=""></a></h1>
      <h1>회원가입</h1>
      <form onsubmit="onSubmitRegister(event)">
        <label for="">핸드폰번호</label>
        <div class="tel_box">
          <input type='tel' data-index="0" name='phone1' maxlength="3" oninput="changeInputTel(event)" placeholder="010" required/>
          <span>-</span>
          <input type='tel' data-index="1" name='phone2' maxlength="4" oninput="changeInputTel(event)" placeholder="0000" required/>
          <span>-</span>
          <input type='tel' data-index="2" name='phone3' maxlength="4" oninput="changeInputTel(event)" placeholder="0000" required/>
        </div>
        <label for="">문자인증</label>
        <div>
          <input id="code_number" type="text" placeholder="인증번호를 입력해주세요" required>
          <button type="button" class="border_btn" onclick="clickRequestVerifyCode(event)">인증번호 받기</button>
        </div>
        
        <label for="">비밀번호</label>
        <div class="password_box">
          <input type="password" placeholder="비밀번호를 입력해주세요" id="password" name="password" required>
          <button class="not_btn_box" onclick="clickToggleShowPassword(event)">
            <i class="ph ph-eye"></i>
            <i class="ph ph-eye-slash"></i>
          </button>
        </div>
        <!-- <label for="">매장 아이디 (매장 로그인 시 사용할 아이디)</label>
        <input type="text" placeholder="아이디를 입력해주세요"> -->
        <div class="form_msg" id="form_msg"></div>
        <div id="recaptcha-container"></div>
        <input type="submit" value="회원가입">
        <div class="buttons another">
          <a href="/login">로그인으로 돌아가기</a>
        </div>
      </form>
    </main>
    <aside></aside>
  </div>
  <div class="toast_wrap" id="toast_wrap"></div>
  <script src="/static/js/login.js"></script>

  <!-- Firebase 전화 인증 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
    const app = initializeApp({{ firebase | tojson }});
    const auth = getAuth(app);
    auth.languageCode = 'ko';
    let confirmationResult = null;
    let recaptcha = null;
    function toE164(tel) { return '+82' + String(tel).replace(/\D/g, '').replace(/^0/, ''); }
    window.ogFirebasePhone = {
      sendCode: async function (tel) {
        if (!recaptcha) {
          recaptcha = new RecaptchaVerifier(auth, 'recaptcha-container', { size: 'invisible' });
          await recaptcha.render();
        }
        confirmationResult = await signInWithPhoneNumber(auth, toE164(tel), recaptcha);
        return true;
      },
      confirmCode: async function (code) {
        if (!confirmationResult) throw new Error('인증번호를 먼저 받아주세요');
        const cred = await confirmationResult.confirm(code);
        return await cred.user.getIdToken();
      }
    };
  </script>
</body>
</html>
