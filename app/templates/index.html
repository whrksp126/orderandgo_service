<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OrderAndGo</title>
  <link rel="icon" type="image/x-icon" href="/static/images/common/logo.png">
  <link rel="apple-touch-icon" href="/static/images/common/apple-touch-icon.png?v=2">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1FAA9C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="오더앤고">

  <!-- 시작 초기 css 설정 -->
  <link rel="stylesheet" href="static/css/responsive.css">
  <link rel="stylesheet" href="static/css/reset.css">
  <link rel="stylesheet" href="static/css/common.css">
  <!-- 아이콘 -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- 전용 css -->
  <link rel="stylesheet" href="static/css/index.css">


  <style>
  </style>
</head>

<body>
  <header>
    <a onclick="location.reload();">
      <h1>
        <img src="/static/images/common/logo-order&go-color.png" alt="">
      </h1>
    </a>
    <div class="header-settings-wrap">
      <button class="btn-settings" onclick="toggleSettingsDropdown(event)">
        <i class="ph ph-gear"></i>
      </button>
      <ul class="settings-dropdown-list" id="settingsDropdown">
        <li onclick="location.href='/store/store_info'">
          <i class="ph ph-storefront"></i> 매장 정보 관리
        </li>
        <li class="logout-item" onclick="clickLogout(event)">
          <i class="ph ph-sign-out"></i> 로그아웃
        </li>
        <li onclick="window.open('/terms','_blank')">
          <i class="ph ph-file-text"></i> 이용약관 · 개인정보처리방침
        </li>
        <li class="disabled">
          <i class="ph ph-book-open"></i> 사용 메뉴얼
        </li>
        <li class="disabled">
          <i class="ph ph-megaphone"></i> 공지사항 · Q&A
        </li>
      </ul>
    </div>
  </header>
  <main>
    <ul>
      <li>
        <a href="/pos/tableList">
          <i class="ph ph-cash-register"></i>
          <span>POS</span>
        </a>
      </li>
      <li>
        <a href="/table_order/login">
          <i class="ph ph-device-tablet"></i>
          <span>테이블 오더</span>
        </a>
      </li>
      <li>
        <a href="/kds/">
          <i class="ph ph-cooking-pot"></i>
          <span>주방 주문 관리</span>
        </a>
      </li>
      <li>
        <a href="/store/product">
          <i class="ph ph-storefront"></i>
          <span>매장 관리</span>
        </a>
      </li>
    </ul>
  </main>
  <!-- 공통 스크립트 -->
  <!-- <script src="static/js/common.js"></script> -->
  <!-- 전용 스크립트 -->
  <!-- <script src="static/js/main.js"></script> -->
  <script>
    const clickLogout = (event) => {
      fetch(`/logout`, { method: 'GET' })
        .then(response => response.json())
        .then(data => {
          if (data.code == 200) window.location.href = '/login';
        })
        .catch(error => console.error('Error:', error));
    };

    const toggleSettingsDropdown = (event) => {
      event.stopPropagation();
      document.getElementById('settingsDropdown').classList.toggle('active');
    };

    document.addEventListener('click', () => {
      document.getElementById('settingsDropdown').classList.remove('active');
    });
  </script>
</body>

</html>
