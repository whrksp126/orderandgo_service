<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OrderAndGo · 영업일 설정</title>
  <link rel="icon" type="image/x-icon" href="/static/images/common/logo.png">

  <link rel="stylesheet" href="/static/css/responsive.css">
  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/common.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/animation.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="/static/css/store.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/store_settings.css?v={{ static_v }}">
</head>

<body class="setting_page setting_form_page biz_day_page">
  <div id="container">
    <header>
      <a class="back_btn" href="/store/product">
        <i class="ph-bold ph-caret-left"></i>
      </a>
      <div class="center">
        <a onclick="location.reload();">
          <h1><img src="/static/images/common/logo-order&go-white.png" alt=""></h1>
        </a>
        <div class="header_info">
          <span class="cur_time"></span>
          <span class="store_state" data-state="open">영업중</span>
        </div>
      </div>
    </header>

    <main>
      <div class="setting_row">
        <h2>영업일 초기화 시각</h2>
        <div class="setting_field">
          <input type="time" class="setting_input short" id="input-cutoff" value="{{ business_day_cutoff }}">
          <p class="setting_note">이 시각에 영업일이 바뀝니다. 자정을 넘긴 주문도 이 시각 전까지는 전날 영업일로 집계됩니다.</p>
        </div>
      </div>
      <div class="setting_row">
        <h2></h2>
        <div class="setting_field">
          <div class="setting_line">
            <button class="setting_btn fill large" onclick="saveCutoff()">저장</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/static/js/common.js?v={{ static_v }}"></script>
  <script src="/static/js/device-notice.js?v={{ static_v }}"></script>
  <script>
    const saveCutoff = () => {
      const val = document.getElementById('input-cutoff').value.trim();
      if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(val)) {
        showToast('올바른 시각을 입력해주세요.', 'error');
        return;
      }
      fetch('/store/update_business_day', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ business_day_cutoff: val }),
      })
        .then(res => res.json())
        .then(result => {
          if (result.code === 200) showToast('저장되었습니다.', 'success');
          else showToast(result.msg || '저장에 실패했습니다.', 'error');
        })
        .catch(() => showToast('저장에 실패했습니다.', 'error'));
    };
  </script>
</body>

</html>
