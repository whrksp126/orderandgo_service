<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OrderAndGo - 영업일 설정</title>
  <link rel="icon" type="image/x-icon" href="/static/images/common/logo.png">

  <link rel="stylesheet" href="/static/css/responsive.css">
  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/common.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    body { background-color: #F8F9FA; min-height: 100vh; }

    header {
      display: flex;
      align-items: center;
      height: 56px;
      padding: 0 20px;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      gap: 12px;
    }

    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 20px;
      color: #333;
      text-decoration: none;
      transition: background .15s;
    }

    .back-btn:hover { background: #f1f3f5; }
    .page-title { font-size: 17px; font-weight: 700; color: #222; }

    main { max-width: 560px; margin: 32px auto; padding: 0 20px; }

    .info-card {
      background: #fff;
      border-radius: 10px;
      border: 1px solid #e0e0e0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .field-row { display: flex; flex-direction: column; gap: 7px; }
    .field-label { font-size: 13px; font-weight: 700; color: #495057; }

    .field-input {
      width: 100%;
      padding: 12px;
      border: 1px solid #CCC;
      border-radius: 6px;
      font-size: 15px;
      color: #222;
      background: #fff;
      box-sizing: border-box;
      transition: border-color .2s, box-shadow .2s;
    }

    .field-input:focus {
      outline: none;
      border-color: #1FAA9C;
      box-shadow: 0 0 0 3px rgba(31, 170, 156, 0.12);
    }

    .field-hint { font-size: 12px; color: #868E96; line-height: 1.6; }

    .save-btn {
      width: 100%;
      padding: 14px;
      background: #1FAA9C;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
      transition: background .15s;
    }

    .save-btn:hover { background: #178f83; }
    .save-btn:active { background: #12766d; }

    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #222;
      color: #fff;
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: all .3s;
      white-space: nowrap;
      z-index: 999;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>

<body>
  <header>
    <a class="back-btn" href="/store/product" title="뒤로가기">
      <i class="ph-bold ph-caret-left"></i>
    </a>
    <span class="page-title">영업일 설정</span>
  </header>

  <main>
    <div class="info-card">
      <div class="field-row">
        <label class="field-label" for="input-cutoff">영업일 초기화 기준 시각</label>
        <input class="field-input" id="input-cutoff" type="time" value="{{ business_day_cutoff }}">
        <span class="field-hint">
          이 시각을 기준으로 하루(영업일)가 나뉩니다.<br>
          주방(KDS) <b>완료 목록</b>은 현재 영업일 건만 표시됩니다.<br>
          예) <b>06:00</b> → 새벽 6시에 영업일이 바뀌며, 자정을 넘긴 심야 영업분도 전날 영업일로 집계됩니다.
        </span>
      </div>
      <button class="save-btn" onclick="saveCutoff()">저장</button>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const showToast = (msg, isError = false) => {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.background = isError ? '#F43E25' : '#222';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    };

    const saveCutoff = () => {
      const val = document.getElementById('input-cutoff').value.trim();
      if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(val)) {
        showToast('올바른 시각을 입력해주세요.', true);
        return;
      }
      fetch('/store/update_business_day', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ business_day_cutoff: val }),
      })
        .then(res => res.json())
        .then(result => {
          if (result.code === 200) showToast('저장되었습니다.');
          else showToast(result.msg || '저장에 실패했습니다.', true);
        })
        .catch(() => showToast('저장에 실패했습니다.', true));
    };
  </script>
</body>

</html>
