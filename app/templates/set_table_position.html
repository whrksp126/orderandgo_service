<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OrderAndGo</title>
  <link rel="icon" type="image/x-icon" href="/static/images/common/logo.png">

  <link rel="stylesheet" href="/static/css/responsive.css">
  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/animation.css">

  <script src="/static/js/htmls.js"></script>

  <!-- 아이콘 -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <link rel="stylesheet" href="/static/css/store.css">
  <link rel="stylesheet" href="/static/css/canvas.css">
</head>

<body class="set_table_position">
  <div id="container">
    <header>
      <a class="back_btn" onclick="history.back();">
        <i class="ph-bold ph-caret-left"></i>
      </a>
      <div class="center">
        <a onclick="location.reload();">
          <h1>
            <img src="/static/images/common/logo-order&go-white.png" alt="">
          </h1>
        </a>
        <div class="header_info">
          <span class="cur_time">2023-05-01(월) 14:00</span>
          <span class="store_state" data-state="open">영업중</span>
        </div>
      </div>
    </header>
    <main>
      <section>
        <nav>
          <ul>
            <li data-id="1" data-state="active">
              <button onclick="changeTableCategory(event,0)">매장</button>
            </li>
          </ul>
          <button class="btn_set" onclick="clickSetTableCategoryBtn(event)">
            <i class="ph ph-gear-six"></i>
          </button>
        </nav>
        <article>
          <div class="table-canvas-wrap">
            <div class="canvas-scroll-wrap">
              <div id="table-canvas"></div>
              <div id="page-nav" class="canvas-page-nav"></div>
            </div>
            <div class="unplaced-panel">
              <h3>미배치</h3>
              <button class="add-table-btn" onclick="clickAddTableBtn()">
                <i class="ph ph-plus"></i> 테이블 추가
              </button>
              <ul class="unplaced-list scrollbar_hidden"></ul>
              <button class="save-layout-btn" onclick="clickSaveLayoutBtn()">
                <i class="ph ph-floppy-disk"></i> 저장
              </button>
            </div>
          </div>
        </article>
      </section>
    </main>
  </div>

  <!-- 공통 스크립트 -->
  <script src="/static/js/common.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

  <!-- 전용 스크립트 -->
  <script src="/static/js/setTablePosition.js"></script>
</body>

</html>
