{% extends "base.html" %}

{% block robots %}noindex, follow{% endblock %}
{% block body %}
<div class="og-error">
  <div class="og-error-code">500</div>
  <h1>일시적인 오류가 발생했습니다</h1>

  <a class="og-btn og-btn--primary" href="/">홈으로 돌아가기</a>
</div>
{% endblock %}
