<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OrderAndGo · 테이블 QR 발급</title>
  <link rel="icon" type="image/x-icon" href="/static/images/common/logo.png">

  <link rel="stylesheet" href="/static/css/responsive.css">
  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/animation.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="/static/css/store.css">

  <style>
    .qr-page { padding: 20px; max-width: 1000px; margin: 0 auto; }
    .qr-card { background: #fff; border: 1px solid #eee; border-radius: 14px; padding: 20px; margin-bottom: 20px; }
    .qr-card h2 { font-size: 16px; font-weight: 700; margin-bottom: 14px; color: #222; display: flex; align-items: center; gap: 8px; }
    .qr-card h2 i { color: #1FAA9C; }
    .geo-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .geo-row label { font-size: 14px; color: #444; min-width: 120px; }
    .geo-row input[type="number"] { width: 120px; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; }
    .geo-coords { font-size: 13px; color: #777; }
    .btn { border: none; border-radius: 8px; padding: 9px 14px; font-size: 14px; cursor: pointer; }
    .btn.brand { background: #1FAA9C; color: #fff; }
    .btn.ghost { background: #f2f2f2; color: #333; }
    .btn.small { padding: 6px 10px; font-size: 13px; }
    .switch { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #444; }

    .cat-block { margin-bottom: 18px; }
    .cat-block h3 { font-size: 14px; color: #555; margin-bottom: 10px; }
    .table-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .table-cell { border: 1px solid #eee; border-radius: 10px; padding: 12px; text-align: center; }
    .table-cell .tname { font-weight: 600; margin-bottom: 4px; }
    .table-cell .tstate { font-size: 12px; color: #999; margin-bottom: 8px; }
    .table-cell .tstate.on { color: #1FAA9C; }
    .table-cell .cell-actions { display: flex; gap: 6px; justify-content: center; }

    .qr-modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .qr-modal.active { display: flex; }
    .qr-modal-inner { background: #fff; border-radius: 16px; padding: 24px; width: 340px; text-align: center; }
    .qr-modal-inner h3 { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
    .qr-modal-inner img { width: 260px; height: 260px; object-fit: contain; }
    .qr-modal-inner .qr-url { font-size: 11px; color: #999; word-break: break-all; margin: 10px 0 16px; }
    .qr-modal-actions { display: flex; gap: 8px; justify-content: center; }
  </style>
</head>

<body class="store_product">
  <div id="container">
    <header>
      <a class="back_btn" onclick="window.location.href='/store/product'">
        <i class="ph-bold ph-caret-left"></i>
      </a>
      <div class="center">
        <h1><img src="/static/images/common/logo-order&go-white.png" alt="OrderAndGo"></h1>
        <div class="header_info">
          <span class="store_state" data-state="open">테이블 QR 발급</span>
        </div>
      </div>
    </header>

    <main>
      <div class="qr-page">
        <!-- 매장 위치 / 지오펜스 -->
        <div class="qr-card">
          <h2><i class="ph-bold ph-map-pin"></i> 매장 위치 · 가짜 주문 방지</h2>
          <div class="geo-row">
            <button class="btn brand" onclick="setStoreLocationHere()">
              <i class="ph ph-crosshair"></i> 현재 위치로 매장 좌표 설정
            </button>
            <span class="geo-coords" id="geoCoords">좌표 미설정</span>
          </div>
          <div class="geo-row">
            <label>허용 반경(m)</label>
            <input type="number" id="geoRadius" min="20" max="5000" step="10" value="200">
          </div>
          <div class="geo-row">
            <label class="switch"><input type="checkbox" id="geoEnabled" checked> 위치 기반 주문 제한(지오펜스) 사용</label>
          </div>
          <div class="geo-row">
            <label class="switch"><input type="checkbox" id="requireSession"> 활성 테이블(착석)일 때만 QR 주문 허용</label>
          </div>
          <div class="geo-row">
            <button class="btn brand" onclick="saveGeofence()">설정 저장</button>
          </div>
        </div>

        <!-- 테이블별 QR -->
        <div class="qr-card">
          <h2><i class="ph-bold ph-qr-code"></i> 테이블별 QR</h2>
          <div id="qrTableList"><p style="color:#999;">불러오는 중...</p></div>
        </div>
      </div>
    </main>
  </div>

  <!-- QR 상세 모달 -->
  <div class="qr-modal" id="qrModal" onclick="closeQrModal(event)">
    <div class="qr-modal-inner" onclick="event.stopPropagation()">
      <h3 id="qrModalTitle">테이블 QR</h3>
      <img id="qrModalImg" src="" alt="QR">
      <div class="qr-url" id="qrModalUrl"></div>
      <div class="qr-modal-actions">
        <button class="btn brand" onclick="printCurrentQr()"><i class="ph ph-printer"></i> 인쇄</button>
        <button class="btn ghost" onclick="downloadCurrentQr()"><i class="ph ph-download-simple"></i> 저장</button>
        <button class="btn ghost" onclick="closeQrModal()">닫기</button>
      </div>
    </div>
  </div>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/store_table_qr_mgmt.js"></script>
</body>

</html>
