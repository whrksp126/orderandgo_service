<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OrderAndGo · 프린터 관리</title>
  <link rel="icon" type="image/x-icon" href="/static/images/common/logo.png">

  <link rel="stylesheet" href="/static/css/responsive.css">
  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/common.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/animation.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="/static/css/store.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/store_settings.css?v={{ static_v }}">
</head>

<body class="setting_page printer_mgmt_page">
  <div id="container">
    <header>
      <a class="back_btn" href="/store/product">
        <i class="ph-bold ph-caret-left"></i>
      </a>
      <div class="center">
        <a onclick="location.reload();">
          <h1><img src="/static/images/common/logo-order&go-white.png" alt=""></h1>
        </a>
        <div class="header_info">
          <span class="cur_time"></span>
          <span class="store_state" data-state="open">영업중</span>
        </div>
      </div>
    </header>

    <!-- 미지원 브라우저 경고 -->
    <div id="unsupported_warning">이 브라우저에서는 프린터를 연결할 수 없습니다. Chrome 또는 Edge를 사용해주세요.</div>

    <main>
      <!-- 왼쪽: 프린터 환경 목록 -->
      <div class="setting_panel" id="env_column">
        <div class="setting_panel_top">
          <h2>프린터 환경</h2>
          <button class="setting_btn brand" id="btn_add_env">추가</button>
        </div>
        <div class="setting_panel_body scrollbar_hidden" id="env_list">
          <!-- JS로 렌더링 -->
        </div>
      </div>

      <!-- 오른쪽: 선택된 환경의 프린터 목록 -->
      <div class="setting_panel" id="printer_column">
        <div class="setting_panel_top">
          <h2 id="printer_column_title">프린터</h2>
          <button class="setting_btn brand" id="btn_add_printer" style="display:none;">추가</button>
        </div>
        <div class="setting_panel_body scrollbar_hidden" id="printer_list">
          <div class="setting_empty">프린터 환경을 선택해주세요.</div>
        </div>
      </div>
    </main>
  </div>

  <!-- 환경 추가/수정 모달 -->
  <div class="modal_overlay" id="modal_env">
    <div class="modal_box">
      <div class="modal_title" id="modal_env_title">환경 추가</div>
      <div class="modal_field">
        <label class="setting_label">환경 이름</label>
        <input type="text" class="setting_input" id="modal_env_name" placeholder="예: 포스용, 주방용, 홀용" maxlength="50">
      </div>
      <div class="modal_btns">
        <button class="setting_btn gray" onclick="closeModal('modal_env')">취소</button>
        <button class="setting_btn fill" id="modal_env_confirm">확인</button>
      </div>
    </div>
  </div>

  <!-- 프린터 추가/수정 모달 -->
  <div class="modal_overlay" id="modal_printer">
    <div class="modal_box">
      <div class="modal_title" id="modal_printer_title">프린터 추가</div>
      <div class="modal_field">
        <label class="setting_label">연결된 포트</label>
        <div class="modal_port_box">
          <span class="setting_value port_label empty" id="modal_printer_port_label">포트 미선택</span>
          <button class="setting_btn" id="btn_change_port">변경</button>
        </div>
      </div>
      <div class="modal_field">
        <label class="setting_label">프린터 이름</label>
        <input type="text" class="setting_input" id="modal_printer_name" placeholder="예: 카운터 프린터" maxlength="100">
      </div>
      <div class="modal_field">
        <label class="setting_label">Baud Rate</label>
        <select class="setting_input" id="modal_printer_baud">
          <option value="9600" selected>9600</option>
          <option value="19200">19200</option>
          <option value="38400">38400</option>
          <option value="115200">115200</option>
        </select>
      </div>
      <div class="modal_field">
        <label class="setting_label">메모 (선택)</label>
        <input type="text" class="setting_input" id="modal_printer_desc" placeholder="예: USB 포트 0" maxlength="200">
      </div>
      <div class="modal_btns">
        <button class="setting_btn gray" onclick="closeModal('modal_printer')">취소</button>
        <button class="setting_btn fill" id="modal_printer_confirm">추가</button>
      </div>
    </div>
  </div>

  <!-- 삭제 확인 모달 -->
  <div class="modal_overlay" id="modal_delete">
    <div class="modal_box">
      <div class="modal_title">삭제 확인</div>
      <div class="modal_text" id="modal_delete_msg">삭제할까요?</div>
      <div class="modal_btns">
        <button class="setting_btn gray" onclick="closeModal('modal_delete')">취소</button>
        <button class="setting_btn red_fill" id="modal_delete_confirm">삭제</button>
      </div>
    </div>
  </div>

  <script src="/static/js/common.js?v={{ static_v }}"></script>
  <script src="/static/js/device-notice.js?v={{ static_v }}"></script>
  <script src="/static/js/printer.js?v={{ static_v }}"></script>
  <script>
    // ─── 상태 ────────────────────────────────────────────
    let _environments = [];
    let _selectedEnvId = null;
    let _envModal = { mode: 'create', envId: null };
    let _printerModal = { mode: 'create', printerId: null };
    let _deleteModal = { type: null, id: null };
    // 모달에서 선택된 포트 정보 (추가/수정 시 임시 저장)
    let _selectedPort = { usbVendorId: null, usbProductId: null };

    // ─── 초기화 ──────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {
      if (!PrinterManager.isSupported()) {
        document.getElementById('unsupported_warning').classList.add('show');
      }
      await loadEnvironments();
    });

    // ─── 데이터 로드 ─────────────────────────────────────
    async function loadEnvironments() {
      const data = await fetchDataAsync('/store/get_printer_environments', 'GET', null);
      if (!data || !data.environments) return;
      _environments = data.environments;

      if (_environments.length > 0) {
        const still = _environments.find(e => e.id === _selectedEnvId);
        _selectedEnvId = still ? still.id : _environments[0].id;
      } else {
        _selectedEnvId = null;
      }

      renderEnvList();
      renderPrinterList();
    }

    // ─── 환경 목록 렌더링 ─────────────────────────────────
    function renderEnvList() {
      const container = document.getElementById('env_list');
      container.innerHTML = '';

      if (_environments.length === 0) {
        container.innerHTML = `<div class="setting_empty">프린터 환경이 없습니다.</div>`;
        return;
      }

      _environments.forEach(env => {
        const div = document.createElement('div');
        div.className = 'setting_item env_item' + (env.id === _selectedEnvId ? ' active' : '');
        div.dataset.id = env.id;

        const defaultBadge = env.is_default
          ? `<span class="setting_tag">기본</span>`
          : '';

        div.innerHTML = `
          <span class="env_name">${escapeHtml(env.name)}</span>
          ${defaultBadge}
          <div class="env_actions">
            <button title="이름 수정" onclick="openEditEnvModal(event, ${env.id})">
              <i class="ph ph-pencil-simple"></i>
            </button>
            ${!env.is_default ? `
            <button class="danger" title="삭제" onclick="openDeleteEnvModal(event, ${env.id}, '${escapeHtml(env.name)}')">
              <i class="ph ph-trash"></i>
            </button>` : ''}
          </div>`;

        div.addEventListener('click', (e) => {
          if (e.target.closest('.env_actions')) return;
          selectEnv(env.id);
        });

        container.appendChild(div);
      });
    }

    // ─── 프린터 목록 렌더링 ──────────────────────────────
    function renderPrinterList() {
      const container = document.getElementById('printer_list');
      const titleEl = document.getElementById('printer_column_title');
      const addBtn = document.getElementById('btn_add_printer');

      const env = _environments.find(e => e.id === _selectedEnvId);

      if (!env) {
        titleEl.textContent = '프린터';
        addBtn.style.display = 'none';
        container.innerHTML = `<div class="setting_empty">프린터 환경을 선택해주세요.</div>`;
        return;
      }

      titleEl.textContent = `${env.name} 프린터`;
      addBtn.style.display = 'flex';
      container.innerHTML = '';

      if (env.printers.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'setting_empty';
        empty.textContent = '등록된 프린터가 없습니다.';
        container.appendChild(empty);
      } else {
        env.printers.forEach(printer => {
          const metaText = `Baud: ${printer.baud_rate}` +
            (printer.description ? ` · ${escapeHtml(printer.description)}` : '');

          const hasPort = printer.usb_vendor_id !== null && printer.usb_vendor_id !== undefined;
          const portBadge = hasPort
            ? `<span class="setting_state connected">USB 연결됨</span>`
            : `<span class="setting_state">포트 미선택</span>`;
          const vendorAttr = hasPort ? `data-vendor-id="${printer.usb_vendor_id}" data-product-id="${printer.usb_product_id}"` : '';

          const card = document.createElement('div');
          card.className = 'printer_card';
          card.innerHTML = `
            <div class="printer_card_info">
              <div class="printer_card_name">${escapeHtml(printer.name)}</div>
              <div class="printer_card_meta">${metaText}</div>
            </div>
            ${portBadge}
            <div class="printer_card_actions">
              <button class="setting_btn brand" data-baud="${printer.baud_rate}" ${vendorAttr} onclick="handleTestPrint(this)">테스트 출력</button>
              <button class="setting_btn" onclick="openEditPrinterModal(${printer.id})">수정</button>
              <button class="setting_btn red" onclick="openDeletePrinterModal(${printer.id}, '${escapeHtml(printer.name)}')">삭제</button>
            </div>`;
          container.appendChild(card);
        });
      }
    }

    // ─── 환경 선택 ────────────────────────────────────────
    function selectEnv(envId) {
      _selectedEnvId = envId;
      renderEnvList();
      renderPrinterList();
    }

    // ─── 테스트 출력 ─────────────────────────────────────
    async function handleTestPrint(btn) {
      if (!PrinterManager.isSupported()) {
        showToast('Chrome 또는 Edge 브라우저를 사용해주세요.', 'error');
        return;
      }

      const baudRate = parseInt(btn.dataset.baud) || 19200;
      const vendorId = btn.dataset.vendorId !== undefined ? parseInt(btn.dataset.vendorId) : null;
      const productId = btn.dataset.productId !== undefined ? parseInt(btn.dataset.productId) : null;
      btn.disabled = true;
      const originalHtml = btn.innerHTML;
      btn.textContent = '출력 중';

      try {
        await PrinterManager.testPrint(baudRate, vendorId, productId);
        showToast('테스트 출력이 완료되었습니다.', 'success');
      } catch (e) {
        if (e.message) showToast(e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalHtml;
      }
    }

    // ─── 모달: 환경 추가/수정 ────────────────────────────
    document.getElementById('btn_add_env').addEventListener('click', () => {
      _envModal = { mode: 'create', envId: null };
      document.getElementById('modal_env_title').textContent = '환경 추가';
      document.getElementById('modal_env_name').value = '';
      document.getElementById('modal_env_confirm').textContent = '추가';
      document.getElementById('modal_env').classList.add('show');
      setTimeout(() => document.getElementById('modal_env_name').focus(), 50);
    });

    function openEditEnvModal(e, envId) {
      e.stopPropagation();
      const env = _environments.find(env => env.id === envId);
      if (!env) return;
      _envModal = { mode: 'edit', envId };
      document.getElementById('modal_env_title').textContent = '환경 이름 수정';
      document.getElementById('modal_env_name').value = env.name;
      document.getElementById('modal_env_confirm').textContent = '저장';
      document.getElementById('modal_env').classList.add('show');
      setTimeout(() => document.getElementById('modal_env_name').focus(), 50);
    }

    document.getElementById('modal_env_confirm').addEventListener('click', async () => {
      const name = document.getElementById('modal_env_name').value.trim();
      if (!name) { showToast('환경 이름을 입력해주세요.', 'error'); return; }

      if (_envModal.mode === 'create') {
        const res = await fetchDataAsync('/store/create_printer_environment', 'POST', { name });
        if (res) {
          closeModal('modal_env');
          await loadEnvironments();
          const newEnv = _environments[_environments.length - 1];
          if (newEnv) selectEnv(newEnv.id);
          showToast('환경이 추가되었습니다.', 'success');
        }
      } else {
        const res = await fetchDataAsync('/store/update_printer_environment', 'PATCH', { env_id: _envModal.envId, name });
        if (res) {
          closeModal('modal_env');
          await loadEnvironments();
          showToast('환경 이름이 수정되었습니다.', 'success');
        }
      }
    });

    // ─── 모달: 환경 삭제 ─────────────────────────────────
    function openDeleteEnvModal(e, envId, envName) {
      e.stopPropagation();
      _deleteModal = { type: 'env', id: envId };
      document.getElementById('modal_delete_msg').textContent =
        `"${envName}" 환경을 삭제할까요? 이 환경의 프린터도 함께 삭제됩니다.`;
      document.getElementById('modal_delete').classList.add('show');
    }

    // ─── 포트 정보 모달 표시 헬퍼 ───────────────────────
    function updateModalPortDisplay() {
      const label = document.getElementById('modal_printer_port_label');
      if (_selectedPort.usbVendorId !== null && _selectedPort.usbVendorId !== undefined) {
        label.textContent = `0x${_selectedPort.usbVendorId.toString(16).toUpperCase().padStart(4,'0')} / 0x${_selectedPort.usbProductId !== null ? _selectedPort.usbProductId.toString(16).toUpperCase().padStart(4,'0') : '????'}`;
        label.classList.remove('empty');
      } else {
        label.textContent = '포트 미선택';
        label.classList.add('empty');
      }
    }

    // ─── 모달: 프린터 추가/수정 ──────────────────────────
    async function openAddPrinterModal() {
      if (!_selectedEnvId) return;

      // Web Serial 지원 시 포트 먼저 선택 (클릭 제스처 컨텍스트에서 바로 호출)
      _selectedPort = { usbVendorId: null, usbProductId: null };
      if (PrinterManager.isSupported()) {
        try {
          const portInfo = await PrinterManager.selectPort();
          if (portInfo === null) return; // 사용자가 취소
          _selectedPort = portInfo;
        } catch (e) {
          showToast(e.message || '포트 선택 실패', 'error');
          return;
        }
      }

      _printerModal = { mode: 'create', printerId: null };
      document.getElementById('modal_printer_title').textContent = '프린터 추가';
      document.getElementById('modal_printer_name').value = '';
      document.getElementById('modal_printer_baud').value = '9600';
      document.getElementById('modal_printer_desc').value = '';
      document.getElementById('modal_printer_confirm').textContent = '추가';
      updateModalPortDisplay();
      document.getElementById('modal_printer').classList.add('show');
      setTimeout(() => document.getElementById('modal_printer_name').focus(), 50);
    }

    document.getElementById('btn_add_printer').addEventListener('click', openAddPrinterModal);

    function openEditPrinterModal(printerId) {
      const env = _environments.find(e => e.id === _selectedEnvId);
      if (!env) return;
      const printer = env.printers.find(p => p.id === printerId);
      if (!printer) return;

      // 기존 포트 정보 로드
      _selectedPort = {
        usbVendorId: printer.usb_vendor_id ?? null,
        usbProductId: printer.usb_product_id ?? null
      };

      _printerModal = { mode: 'edit', printerId };
      document.getElementById('modal_printer_title').textContent = '프린터 수정';
      document.getElementById('modal_printer_name').value = printer.name;
      document.getElementById('modal_printer_baud').value = String(printer.baud_rate);
      document.getElementById('modal_printer_desc').value = printer.description || '';
      document.getElementById('modal_printer_confirm').textContent = '저장';
      updateModalPortDisplay();
      document.getElementById('modal_printer').classList.add('show');
      setTimeout(() => document.getElementById('modal_printer_name').focus(), 50);
    }

    document.getElementById('modal_printer_confirm').addEventListener('click', async () => {
      const name = document.getElementById('modal_printer_name').value.trim();
      const baudRate = parseInt(document.getElementById('modal_printer_baud').value);
      const description = document.getElementById('modal_printer_desc').value.trim();

      if (!name) { showToast('프린터 이름을 입력해주세요.', 'error'); return; }

      const portPayload = {
        usb_vendor_id: _selectedPort.usbVendorId,
        usb_product_id: _selectedPort.usbProductId
      };

      if (_printerModal.mode === 'create') {
        const res = await fetchDataAsync('/store/create_printer', 'POST', {
          environment_id: _selectedEnvId,
          name, baud_rate: baudRate, description,
          ...portPayload
        });
        if (res) {
          closeModal('modal_printer');
          await loadEnvironments();
          showToast('프린터가 추가되었습니다.', 'success');
        }
      } else {
        const res = await fetchDataAsync('/store/update_printer', 'PATCH', {
          printer_id: _printerModal.printerId,
          name, baud_rate: baudRate, description,
          ...portPayload
        });
        if (res) {
          closeModal('modal_printer');
          await loadEnvironments();
          showToast('프린터 정보가 수정되었습니다.', 'success');
        }
      }
    });

    // ─── 모달: 포트 변경 버튼 ────────────────────────────
    document.getElementById('btn_change_port').addEventListener('click', async () => {
      if (!PrinterManager.isSupported()) {
        showToast('Chrome 또는 Edge 브라우저에서만 포트 선택이 가능합니다.', 'error');
        return;
      }
      try {
        const portInfo = await PrinterManager.selectPort();
        if (portInfo === null) return; // 사용자가 취소
        _selectedPort = portInfo;
        updateModalPortDisplay();
      } catch (e) {
        showToast(e.message || '포트 선택 실패', 'error');
      }
    });

    // ─── 모달: 프린터 삭제 ───────────────────────────────
    function openDeletePrinterModal(printerId, printerName) {
      _deleteModal = { type: 'printer', id: printerId };
      document.getElementById('modal_delete_msg').textContent =
        `"${printerName}" 프린터를 삭제할까요?`;
      document.getElementById('modal_delete').classList.add('show');
    }

    // ─── 삭제 확인 공통 ──────────────────────────────────
    document.getElementById('modal_delete_confirm').addEventListener('click', async () => {
      try {
        if (_deleteModal.type === 'env') {
          const res = await fetchDataAsync('/store/delete_printer_environment', 'DELETE', { env_id: _deleteModal.id });
          if (res) {
            closeModal('modal_delete');
            _selectedEnvId = null;
            await loadEnvironments();
            showToast('환경이 삭제되었습니다.', 'success');
          }
        } else if (_deleteModal.type === 'printer') {
          const res = await fetchDataAsync('/store/delete_printer', 'DELETE', { printer_id: _deleteModal.id });
          if (res) {
            closeModal('modal_delete');
            await loadEnvironments();
            showToast('프린터가 삭제되었습니다.', 'success');
          }
        }
      } catch (e) {
        showToast('삭제 중 오류가 발생했습니다.', 'error');
      }
    });

    // ─── 모달 닫기 ────────────────────────────────────────
    function closeModal(id) {
      document.getElementById(id).classList.remove('show');
    }

    // 모달 외부 클릭 시 닫기
    document.querySelectorAll('.modal_overlay').forEach(overlay => {
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) overlay.classList.remove('show');
      });
    });

    // Enter 키로 모달 확인
    document.getElementById('modal_env_name').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('modal_env_confirm').click();
    });
    document.getElementById('modal_printer_name').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('modal_printer_confirm').click();
    });
    document.getElementById('modal_printer_desc').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('modal_printer_confirm').click();
    });

    // ─── 유틸 ─────────────────────────────────────────────
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
</body>

</html>
