<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OrderAndGo · QR 주문 설정</title>
  <link rel="icon" type="image/x-icon" href="/static/images/common/logo.png">

  <link rel="stylesheet" href="/static/css/responsive.css">
  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/common.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/animation.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="/static/css/store.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/store_settings.css?v={{ static_v }}">
</head>

<body class="setting_page setting_form_page qr_settings_page">
  <div id="container">
    <header>
      <a class="back_btn" href="/store/product">
        <i class="ph-bold ph-caret-left"></i>
      </a>
      <div class="center">
        <a onclick="location.reload();">
          <h1><img src="/static/images/common/logo-order&go-white.png" alt=""></h1>
        </a>
        <div class="header_info">
          <span class="cur_time"></span>
          <span class="store_state" data-state="open">영업중</span>
        </div>
      </div>
    </header>

    <main>
      <div class="setting_row">
        <h2>매장 위치</h2>
        <div class="setting_field">
          <div class="setting_line">
            <button class="setting_btn brand" onclick="setStoreLocationHere()">현재 위치로 설정</button>
            <span id="geoCoords">좌표 미설정</span>
          </div>
        </div>
      </div>
      <div class="setting_row">
        <h2>허용 반경</h2>
        <div class="setting_field">
          <div class="setting_line">
            <input type="number" class="setting_input short" id="geoRadius" min="20" max="5000" step="10" value="200">
            <span>m</span>
          </div>
        </div>
      </div>
      <div class="setting_row">
        <h2>위치 기반 주문 제한</h2>
        <div class="setting_field">
          <div class="setting_line">
            <label class="setting_switch"><input type="checkbox" id="geoEnabled" checked><span></span></label>
            <span>허용 반경 밖에서는 QR 주문을 받지 않습니다.</span>
          </div>
        </div>
      </div>
      <div class="setting_row">
        <h2>착석 테이블만 주문</h2>
        <div class="setting_field">
          <div class="setting_line">
            <label class="setting_switch"><input type="checkbox" id="requireSession"><span></span></label>
            <span>이용 중인 테이블에서만 QR 주문을 받습니다.</span>
          </div>
        </div>
      </div>
      <div class="setting_row">
        <h2></h2>
        <div class="setting_field">
          <div class="setting_line">
            <button class="setting_btn fill large" onclick="saveGeofence()">저장</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/static/js/common.js?v={{ static_v }}"></script>
  <script src="/static/js/device-notice.js?v={{ static_v }}"></script>
  <script src="/static/js/store_qr_settings.js?v={{ static_v }}"></script>
</body>

</html>
