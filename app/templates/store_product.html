<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OrderAndGo</title>
  <link rel="icon" type="image/x-icon" href="/static/images/common/logo.png">

  <!-- 시작 초기 css 설정 -->
  <link rel="stylesheet" href="/static/css/responsive.css">
  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/animation.css">
  <!-- 아이콘 -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- 전용 css -->
  <link rel="stylesheet" href="/static/css/store.css">
</head>

<body class="store_product">
  <div id="container">
    <header>
      <!-- <h1>POS - Header</h1>-->
      <a class="back_btn" onclick="window.location.href='/'">
        <i class="ph-bold ph-caret-left"></i>
      </a>
      <div class="center">
        <a onclick="location.reload();">
          <h1>
            <img src="/static/images/common/logo-order&go-white.png" alt="">
          </h1>
        </a>
        <div class="header_info">
          <span class="cur_time">2023-05-01(월) 14:00</span>
          <span class="store_state" data-state="open">영업중</span>
        </div>
      </div>
    </header>
    <main>
      <nav>
        <ul>
          <li class="tab-link active" onclick="openTab(event, 'pos-mgmt')"><a>POS관리</a></li>
          <li class="tab-link" onclick="openTab(event, 'table-order-mgmt')"><a>테이블오더관리</a></li>
        </ul>
      </nav>
      <section id="pos-mgmt" class="tab-content" style="display: block;">
        <ul>
          <li>
            <h2>상품</h2>
            <a href="/store/set_menu">
              <i class="ph ph-cube"></i>
              <span>상품 정보 수정</span>
            </a>
            <a href="/store/set_menu_position">
              <i class="ph ph-cube-focus"></i>
              <span>상품 배치 수정</span>
            </a>
          </li>
          <li>
            <h2>구역/테이블</h2>
            <a href="/store/set_table">
              <i class="ph ph-subtract-square"></i>
              <span>테이블 설정</span>
            </a>
            <a class="disabled"></a>
          </li>
          <li>
            <h2>결제 단말기</h2>
            <a href="/store/terminal_mgmt">
              <i class="ph ph-device-mobile"></i>
              <span>단말기 관리</span>
            </a>
            <a class="disabled"></a>
          </li>
          <li>
            <h2>프린터</h2>
            <a href="/store/printer_mgmt">
              <i class="ph ph-printer"></i>
              <span>프린터 관리</span>
            </a>
            <a class="disabled"></a>
          </li>
          <li>
            <h2>결제 내역</h2>
            <a href="/store/payment_history">
              <i class="ph ph-receipt"></i>
              <span>결제 내역 관리</span>
            </a>
            <a class="disabled"></a>
          </li>
        </ul>
      </section>

      <section id="table-order-mgmt" class="tab-content" style="display: none;">
        <ul>
          <li>
            <h2>서비스</h2>
            <a href="/store/staff_call_mgmt">
              <i class="ph ph-bell"></i>
              <span>직원 호출 관리</span>
            </a>
          </li>
        </ul>
      </section>
    </main>
  </div>

  <!-- 공통 스크립트 -->
  <script src="/static/js/common.js"></script>
  <!-- 전용 스크립트 -->
  <!-- <script src="/static/js/menuList.js"></script> -->
  <script>
    function openTab(evt, tabName) {
      var i, tabcontent, tablinks;
      tabcontent = document.getElementsByClassName("tab-content");
      for (i = 0; i < tabcontent.length; i++) {
        tabcontent[i].style.display = "none";
      }
      tablinks = document.getElementsByClassName("tab-link");
      for (i = 0; i < tablinks.length; i++) {
        tablinks[i].className = tablinks[i].className.replace(" active", "");
      }
      document.getElementById(tabName).style.display = "block";
      evt.currentTarget.className += " active";
    }
  </script>
</body>

</html>
