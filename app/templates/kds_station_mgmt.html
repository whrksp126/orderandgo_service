<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OrderAndGo · 주문 접수 스테이션 관리</title>
  <link rel="icon" type="image/x-icon" href="/static/images/common/logo.png">

  <link rel="stylesheet" href="/static/css/responsive.css">
  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/common.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/animation.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="/static/css/store.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/css/store_settings.css?v={{ static_v }}">
</head>

<body class="setting_page kds-station-mgmt">
  <div id="container">
    <header>
      <a class="back_btn" href="/store/product">
        <i class="ph-bold ph-caret-left"></i>
      </a>
      <div class="center">
        <a onclick="location.reload();">
          <h1><img src="/static/images/common/logo-order&go-white.png" alt=""></h1>
        </a>
        <div class="header_info">
          <span class="cur_time"></span>
          <span class="store_state" data-state="open">영업중</span>
        </div>
      </div>
    </header>

    <main>
      <!-- 좌측: 스테이션 목록 + 편집 패널 -->
      <aside class="setting_panel">
        <div class="setting_panel_top">
          <h2>스테이션</h2>
          <button class="setting_btn brand" onclick="clickAddStation()">추가</button>
        </div>

        <div class="station-list scrollbar_hidden" id="stationList">
          <div class="setting_empty">불러오는 중</div>
        </div>

        <div class="edit-panel" id="editPanel">
          <p class="setting_label" id="editPanelTitle">스테이션 추가</p>

          <input type="text" class="setting_input" id="stationNameInput" placeholder="스테이션 이름">

          <div class="setting_toggle_row">
            <span>전체 주문 표시</span>
            <button class="toggle_btn" id="showAllToggle" data-active="false" onclick="toggleShowAll()">
              <div class="ball"></div>
            </button>
          </div>

          <div class="setting_panel_bottom">
            <button class="setting_btn red" id="deleteBtnPanel" onclick="deleteStation()" style="display:none;">삭제</button>
            <button class="setting_btn gray" onclick="resetEditPanel()">취소</button>
            <button class="setting_btn fill" onclick="saveStation()">저장</button>
          </div>

          <input type="hidden" id="editingStationId" value="">
        </div>
      </aside>

      <!-- 우측: 아이템 연동 패널 -->
      <article class="setting_panel" id="itemArticle">
        <div class="setting_empty" id="articlePlaceholder">스테이션을 선택해주세요.</div>

        <div class="item-panel" id="itemPanel" style="display: none;">
          <div class="setting_panel_top">
            <h2><span id="selectedStationName"></span> 표시 항목</h2>
            <span class="show-all-notice" id="showAllNotice">전체 주문 표시 중</span>
          </div>

          <div class="item-panel-body scrollbar_hidden">
            <!-- 메뉴 섹션 -->
            <div class="item-section">
              <p class="item-section-title">메뉴</p>
              <div id="menuCheckList"></div>
            </div>


            <!-- 직원호출 섹션 -->
            <div class="item-section">
              <p class="item-section-title">직원 호출</p>
              <div id="staffCallCheckList"></div>
            </div>
          </div>

          <div class="item-panel-footer">
            <button class="setting_btn fill large" onclick="saveItemAssignment()">저장</button>
          </div>
        </div>
      </article>
    </main>
  </div>

  <script src="/static/js/common.js?v={{ static_v }}"></script>
  <script src="/static/js/device-notice.js?v={{ static_v }}"></script>
  <script>
    let stations = [];
    let allMenus = [];        // { id, name, price, main_category_name, sub_category_name }
    let allStaffCallItems = [];
    let selectedStationId = null;
    let editMode = 'add';     // 'add' | 'edit'

    document.addEventListener('DOMContentLoaded', () => {
      Promise.all([loadStations(), loadAllMenus(), loadAllStaffCallItems()]);
    });

    // ── 데이터 로드 ──────────────────────────────────────────────

    async function loadStations() {
      try {
        const res = await fetch('/store/get_kds_stations');
        stations = await res.json();
        renderStationList();
        if (selectedStationId) {
          const s = stations.find(x => x.id === selectedStationId);
          if (s) renderItemPanel(s);
        }
      } catch (e) {
        showToast('스테이션 데이터를 불러오는 중 오류가 발생했습니다.', 'error');
      }
    }

    async function loadAllMenus() {
      try {
        const res = await fetch('/store/all_menu_list');
        const data = await res.json();
        allMenus = Array.isArray(data) ? data : [];
      } catch (e) {
        allMenus = [];
      }
    }

    async function loadAllStaffCallItems() {
      try {
        const res = await fetch('/store/get_staff_call_items');
        const data = await res.json();
        allStaffCallItems = data.items || [];
      } catch (e) {
        allStaffCallItems = [];
      }
    }

    // ── 스테이션 목록 렌더링 ─────────────────────────────────────

    function renderStationList() {
      const list = document.getElementById('stationList');
      if (stations.length === 0) {
        list.innerHTML = '<div class="setting_empty">스테이션이 없습니다.</div>';
        return;
      }
      list.innerHTML = '';
      stations.forEach(s => {
        const card = document.createElement('div');
        card.className = 'setting_item station-card' + (s.id === selectedStationId ? ' active' : '');
        const menuCount = s.menu_ids.length;
        const staffCount = s.staff_call_ids.length;
        card.innerHTML = `
          <div class="station-card-name">${s.name}</div>
          <div class="station-card-meta">
            ${s.show_all ? '<span class="setting_tag">전체 주문</span>' : ''}
            <span class="station-card-count">메뉴 ${menuCount}개 · 직원호출 ${staffCount}개</span>
          </div>
        `;
        card.onclick = () => selectStation(s);
        list.appendChild(card);
      });
    }

    // ── 스테이션 선택 ────────────────────────────────────────────

    function selectStation(station) {
      selectedStationId = station.id;
      renderStationList();
      renderItemPanel(station);

      // 편집 패널에 선택된 스테이션 정보 채우기
      editMode = 'edit';
      document.getElementById('editPanelTitle').textContent = '스테이션 수정';
      document.getElementById('stationNameInput').value = station.name;
      document.getElementById('showAllToggle').dataset.active = station.show_all ? 'true' : 'false';
      document.getElementById('editingStationId').value = station.id;
      document.getElementById('deleteBtnPanel').style.display = 'block';
    }

    // ── 아이템 연동 패널 렌더링 ──────────────────────────────────

    function renderItemPanel(station) {
      document.getElementById('articlePlaceholder').style.display = 'none';
      document.getElementById('itemPanel').style.display = 'flex';
      document.getElementById('selectedStationName').textContent = station.name;

      const notice = document.getElementById('showAllNotice');
      if (station.show_all) {
        notice.classList.add('visible');
      } else {
        notice.classList.remove('visible');
      }

      renderMenuChecklist(station.menu_ids);
      renderStaffCallChecklist(station.staff_call_ids);
    }

    function renderMenuChecklist(selectedIds) {
      const container = document.getElementById('menuCheckList');
      container.innerHTML = '';

      if (allMenus.length === 0) {
        container.innerHTML = '<div class="setting_empty">등록된 메뉴가 없습니다.</div>';
        return;
      }

      // 전체 선택 행
      const bulkRow = document.createElement('div');
      bulkRow.className = 'bulk-check-row';
      bulkRow.innerHTML = `
        <label>
          <input type="checkbox" id="checkAllMenus" onchange="toggleAllMenus(this.checked)">
          <span>전체 선택</span>
        </label>
      `;
      container.appendChild(bulkRow);

      // 메인 카테고리별 그룹화
      const grouped = {};
      allMenus.forEach(menu => {
        const key = menu.main_category_name || '미분류';
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(menu);
      });

      Object.keys(grouped).forEach(catName => {
        const group = document.createElement('div');
        group.className = 'category-group';
        const safeCatName = catName.replace(/'/g, "\\'");
        group.innerHTML = `
          <div class="category-group-title">
            <label>
              <input type="checkbox" class="group-check" data-group="${safeCatName}" onchange="toggleGroupMenus('${safeCatName}', this.checked)">
              ${catName}
            </label>
          </div>
        `;

        grouped[catName].forEach(menu => {
          const checked = selectedIds.includes(menu.id);
          const row = document.createElement('label');
          row.className = 'item-check-row';
          row.dataset.group = catName;
          row.innerHTML = `
            <input type="checkbox" class="menu-check" value="${menu.id}" data-group="${safeCatName}" ${checked ? 'checked' : ''} onchange="syncGroupCheck('${safeCatName}')">
            <span class="item-check-label">${menu.name}</span>
            <span class="item-check-price">${menu.price ? menu.price.toLocaleString() + '원' : ''}</span>
          `;
          group.appendChild(row);
        });

        container.appendChild(group);
      });

      syncAllCheck();
    }

    function toggleAllMenus(checked) {
      document.querySelectorAll('.menu-check').forEach(cb => cb.checked = checked);
      document.querySelectorAll('.group-check').forEach(cb => cb.checked = checked);
    }

    function toggleGroupMenus(groupName, checked) {
      document.querySelectorAll(`.menu-check[data-group="${groupName}"]`).forEach(cb => cb.checked = checked);
      syncAllCheck();
    }

    function syncGroupCheck(groupName) {
      const groupCbs = document.querySelectorAll(`.menu-check[data-group="${groupName}"]`);
      const allChecked = Array.from(groupCbs).every(cb => cb.checked);
      const groupCheckbox = document.querySelector(`.group-check[data-group="${groupName}"]`);
      if (groupCheckbox) groupCheckbox.checked = allChecked;
      syncAllCheck();
    }

    function syncAllCheck() {
      const all = document.querySelectorAll('.menu-check');
      const allChecked = all.length > 0 && Array.from(all).every(cb => cb.checked);
      const allCheckbox = document.getElementById('checkAllMenus');
      if (allCheckbox) allCheckbox.checked = allChecked;
    }

    function renderStaffCallChecklist(selectedIds) {
      const container = document.getElementById('staffCallCheckList');
      container.innerHTML = '';

      if (allStaffCallItems.length === 0) {
        container.innerHTML = '<div class="setting_empty">등록된 직원 호출 항목이 없습니다.</div>';
        return;
      }

      allStaffCallItems.forEach(item => {
        const checked = selectedIds.includes(item.id);
        const row = document.createElement('label');
        row.className = 'item-check-row';
        row.innerHTML = `
          <input type="checkbox" class="staff-check" value="${item.id}" ${checked ? 'checked' : ''}>
          <span class="item-check-label">${item.name}</span>
        `;
        container.appendChild(row);
      });
    }

    // ── 편집 패널 조작 ───────────────────────────────────────────

    function clickAddStation() {
      resetEditPanel();
      editMode = 'add';
      document.getElementById('editPanelTitle').textContent = '스테이션 추가';
      document.getElementById('stationNameInput').focus();
    }

    function toggleShowAll() {
      const btn = document.getElementById('showAllToggle');
      btn.dataset.active = btn.dataset.active === 'true' ? 'false' : 'true';
    }

    function resetEditPanel() {
      editMode = 'add';
      document.getElementById('editPanelTitle').textContent = '스테이션 추가';
      document.getElementById('stationNameInput').value = '';
      document.getElementById('showAllToggle').dataset.active = 'false';
      document.getElementById('editingStationId').value = '';
      document.getElementById('deleteBtnPanel').style.display = 'none';
    }

    async function saveStation() {
      const name = document.getElementById('stationNameInput').value.trim();
      const show_all = document.getElementById('showAllToggle').dataset.active === 'true';
      const stationId = document.getElementById('editingStationId').value;

      if (!name) return showToast('스테이션명을 입력해주세요.', 'warning');

      const method = editMode === 'edit' ? 'PATCH' : 'POST';
      const body = { name, show_all };
      if (editMode === 'edit') body.id = parseInt(stationId);

      try {
        const res = await fetchDataAsync('/store/set_kds_station', method, body);
        if (res.code === 200 || res.code === 201) {
          showToast('저장되었습니다.', 'success');
          await loadStations();
          if (editMode === 'add' && res.id) {
            const newStation = stations.find(s => s.id === res.id);
            if (newStation) selectStation(newStation);
          } else if (editMode === 'edit') {
            const updated = stations.find(s => s.id === parseInt(stationId));
            if (updated) renderItemPanel(updated);
          }
        } else {
          showToast(res.message || '저장 중 오류가 발생했습니다.', 'error');
        }
      } catch (e) {
        showToast('서버와의 통신에 실패했습니다.', 'error');
      }
    }

    function deleteStation() {
      const stationId = document.getElementById('editingStationId').value;
      if (!stationId) return;

      const { top, middle, bottom } = openDefaultModal();
      top.innerHTML = modalTopHtml('스테이션 삭제');
      middle.innerHTML = `
        <p class="setting_confirm">이 스테이션을 삭제할까요?
          <span>표시 항목 설정도 함께 삭제됩니다.</span>
        </p>
      `;
      bottom.innerHTML = modalBottomHtml([
        { class: 'gray', text: '취소', fun: 'onclick="removeModal()"' },
        { class: 'red_fill', text: '삭제', fun: 'onclick="confirmDeleteStation()"' }
      ]);
    }

    async function confirmDeleteStation() {
      removeModal();
      const stationId = document.getElementById('editingStationId').value;
      if (!stationId) return;

      try {
        const res = await fetchDataAsync(`/store/set_kds_station?id=${stationId}`, 'DELETE');
        if (res.code === 200) {
          showToast('삭제되었습니다.', 'success');
          selectedStationId = null;
          resetEditPanel();
          document.getElementById('articlePlaceholder').style.display = 'flex';
          document.getElementById('itemPanel').style.display = 'none';
          await loadStations();
        } else {
          showToast(res.message || '삭제 중 오류가 발생했습니다.', 'error');
        }
      } catch (e) {
        showToast('서버와의 통신에 실패했습니다.', 'error');
      }
    }

    // ── 아이템 연동 저장 ─────────────────────────────────────────

    async function saveItemAssignment() {
      if (!selectedStationId) return showToast('스테이션을 먼저 선택해주세요.', 'warning');

      const menuIds = Array.from(document.querySelectorAll('.menu-check:checked')).map(cb => parseInt(cb.value));
      const staffCallIds = Array.from(document.querySelectorAll('.staff-check:checked')).map(cb => parseInt(cb.value));

      try {
        const res = await fetchDataAsync('/store/set_kds_station_items', 'POST', {
          station_id: selectedStationId,
          menu_ids: menuIds,
          staff_call_ids: staffCallIds
        });
        if (res.code === 200) {
          showToast('저장되었습니다.', 'success');
          await loadStations();
        } else {
          showToast(res.message || '저장 중 오류가 발생했습니다.', 'error');
        }
      } catch (e) {
        showToast('서버와의 통신에 실패했습니다.', 'error');
      }
    }
  </script>
</body>

</html>
