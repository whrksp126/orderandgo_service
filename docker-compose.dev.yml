version: '3.8'

# ── Dev 서버 환경 ──────────────────────────────────────────────────────────────
# 사용: docker compose -f docker-compose.dev.yml up -d
# env:  .env.dev
# 도메인: https://dev-order.ghmate.com

services:
  mysql:
    container_name: orderandgo_mysql_dev
    image: mysql:8.0
    env_file: .env.dev
    volumes:
      - mysql_dev_data:/var/lib/mysql
    networks:
      - orderandgo_dev
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  orderandgo_service:
    container_name: orderandgo_service_dev
    image: orderandgo_service:dev
    build:
      context: .
    env_file: .env.dev
    volumes:
      - .:/app
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - orderandgo_dev
      - nginx_proxy
    restart: unless-stopped
    command: /entrypoint.sh

networks:
  orderandgo_dev:
    driver: bridge
  nginx_proxy:
    external: true

volumes:
  mysql_dev_data:
