version: '3.8'

# ── Staging 환경 ──────────────────────────────────────────────────────────────
# 사용: docker compose -f docker-compose.stg.yml up -d
# env:  .env.stg
# 도메인: https://stg-order.ghmate.com

services:
  mysql:
    container_name: orderandgo_mysql_stg
    image: mysql:8.0
    env_file: .env.stg
    volumes:
      - mysql_stg_data:/var/lib/mysql
    networks:
      - orderandgo_stg
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  orderandgo_service:
    container_name: orderandgo_service_stg
    image: whrksp126/orderandgo_service:stg
    build:
      context: .
      platforms:
        - linux/amd64
    env_file: .env.stg
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - orderandgo_stg
      - nginx_proxy
    restart: always
    command: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:5000 wsgi:app

networks:
  orderandgo_stg:
    driver: bridge
  nginx_proxy:
    external: true

volumes:
  mysql_stg_data:
