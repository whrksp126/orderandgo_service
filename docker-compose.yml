version: '3.8'

# ── Production ───────────────────────────────────────────────────────────────
# 사용: docker compose up -d
# env:  .env
# 도메인: https://order.ghmate.com

services:
  mysql:
    container_name: orderandgo_mysql_prod
    image: mysql:8.0
    env_file: .env
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - orderandgo_prod
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    # 공용 13GB/8코어 서버 — 한 프로젝트가 전체를 잡아먹지 않게 상한
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  orderandgo_service:
    container_name: orderandgo_service_prod
    image: orderandgo_service:prod
    build:
      context: .
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - orderandgo_prod
      - nginx_proxy
    restart: always
    # entrypoint 경유: 신규/기존 DB 마이그레이션 + order_status 시드 후 gunicorn 기동
    environment:
      APP_CMD: "gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:5000 --access-logfile - wsgi:app"
    command: /entrypoint.sh
    # 공용 13GB/8코어 서버 — 상한 없으면 OOM 시 옆 프로젝트까지 죽음
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1.0"

networks:
  orderandgo_prod:
    driver: bridge
  nginx_proxy:
    external: true

volumes:
  mysql_data:
